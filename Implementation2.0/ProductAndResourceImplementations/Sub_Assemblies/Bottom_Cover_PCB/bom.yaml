id_short: "BillOfMaterials"
id: "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB-SA001/BillOfMaterials"
description: "Bill of Materials for Bottom Cover with PCB sub-assembly SA-001"

elements:
  - type: collection
    id_short: "Bottom_Cover"
    semantic_id: "https://aausmartlab.org/Semantics/BOMEntry"
    elements:
      - type: property
        id_short: "Description"
        value_type: "xs:string"
        value: "Bottom housing cover"
        semantic_id: "https://aausmartlab.org/Semantics/Description"

      - type: property
        id_short: "Quantity"
        value_type: "xs:integer"
        value: 1
        semantic_id: "https://aausmartlab.org/Semantics/Quantity"

      - type: property
        id_short: "IsConfigurable"
        value_type: "xs:boolean"
        value: true
        semantic_id: "https://aausmartlab.org/Semantics/IsConfigurable"

      - type: reference_element
        id_short: "ComponentTypeRef"
        value: "https://aausmartlab.org/Shells/Component/BottomCover"
        semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeRef"

      - type: reference_element
        id_short: "ComponentInstanceRef"
        value: "https://aausmartlab.org/Shells/Component/BottomCover-BC001/Properties"
        semantic_id: "https://aausmartlab.org/Semantics/ComponentInstanceRef"

  - type: collection
    id_short: "PCB"
    semantic_id: "https://aausmartlab.org/Semantics/BOMEntry"
    elements:
      - type: property
        id_short: "Description"
        value_type: "xs:string"
        value: "PCB for bottom cover sub-assembly"
        semantic_id: "https://aausmartlab.org/Semantics/Description"

      - type: property
        id_short: "Quantity"
        value_type: "xs:integer"
        value: 1
        semantic_id: "https://aausmartlab.org/Semantics/Quantity"

      - type: property
        id_short: "IsConfigurable"
        value_type: "xs:boolean"
        value: false
        semantic_id: "https://aausmartlab.org/Semantics/IsConfigurable"

      - type: property
        id_short: "ConfigurableNote"
        value_type: "xs:string"
        value: "This component is not configurable since it is a specific PCB design for the bottom cover sub-assembly"
        semantic_id: "https://aausmartlab.org/Semantics/ConfigurableNote"

      - type: reference_element
        id_short: "ComponentTypeRef"
        value: "https://aausmartlab.org/Shells/Component/PCB"
        semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeRef"
