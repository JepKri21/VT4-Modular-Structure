id_short: "DrillingCapabilityOffered"
id: "https://aausmartlab.org/Shells/Resources/Drilling-12345678/DrillingCapabilityOffered"
description: "Offered capability template for a drilling capability — parameters expressed as ranges defining the operational envelope"

elements:
  - type: property
    id_short: "CapabilityCategory"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityCategory"
    description: "Describes the category of cabaility, whether it is offered by a resource or required by a product"
    value_type: "xs:string"
    value: "Offered"
  
  - type: property
    id_short: "CapabilityReference"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityReference"
    description: "Describes the specific cabaility offered by a resource or required by a product"
    value_type: "xs:string"
    value: "https://aausmartlab.org/Submodels/Capability/Drilling"

  - type: collection
    id_short: "Parameters"
    semantic_id: "https://aausmartlab.org/Semantics/Parameters"
    description: "Parameters defining the capability envelope"

    elements:
      - type: property
        id_short: "BitDiameter"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/mm"
        description: "Drill bit diameter in mm"
        value: 5.0
        qualifiers:
          - type: "range_min"
            value_type: "xs:float"
            value: 1.0
            kind: "VALUE_QUALIFIER"
          - type: "range_max"
            value_type: "xs:float"
            value: 20.0
            kind: "VALUE_QUALIFIER"

      - type: range
        id_short: "DrillDepth"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/mm"
        description: "Minimum and maximum drill depth in mm"
        min: 0.0
        max: 200.0

      - type: range
        id_short: "SpindleSpeed"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/RPM"
        description: "Spindle speed range in RPM"
        min: 0.0
        max: 1200.0 

      - type: range
        id_short: "SpindleFeed"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/mm_per_s"
        description: "Spindle feed rate range in mm/s"
        min: 0.0
        max: 50.0

      - type: collection
        id_short: "TargetPosition"
        elements:
          - type: range
            id_short: "XPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Possible range of X-coordinate position of hole relative to product placement point"
            min: -50.0
            max: 50.0
          - type: range
            id_short: "YPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Possible range of Y-coordinate position of hole relative to product placement point"
            min: -50.0
            max: 50.0

      - type: property
        id_short: "ComponentReference"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/mm"
        description: "Minimum and maximum drill depth in mm"
        value: ""

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable operation label in multiple languages"
        value:
          dk: "Dette er en boreoperation for en ressource"
          en: "This is a drilling operation for a resource"

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Components this resource can process with this capability"
    element_type: "property"
    value_type: "xs:string"
    items:
      - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
      - "https://aausmartlab.org/Shells/Component/Top_Cover"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Materials that can be processed by this capability"
    element_type: "property"
    value_type: "xs:string"
    items:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"

  - type: reference_element
    id_short: "ResourceReference"
    semantic_id: "https://aausmartlab.org/Semantics/ResourceReference"
    description: "Reference to the physical resource realizing this capability"
    value: "https://aausmartlab.org/Shells/Resources/Drilling-12345678"
