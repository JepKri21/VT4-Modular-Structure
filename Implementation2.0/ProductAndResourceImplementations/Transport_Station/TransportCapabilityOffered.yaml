id_short: "TransportCapabilityOffered"
id: "https://aausmartlab.org/Shells/Resources/Transport-12345678/TransportCapabilityOffered"
description: "Offered capability template for a transport capability — parameters expressed as ranges defining the operational envelope"

elements:
  - type: collection
    id_short: "Parameters"
    semantic_id: "https://aausmartlab.org/Semantics/Parameters"
    description: "Parameters defining the capability envelope"
    elements:
      - type: range
        id_short: "SpeedConstraint"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/m_per_s"
        description: "Minimum and maximum transport speed m/s"
        min: 0.0
        max: 3.0

      - type: range
        id_short: "AccelerationConstraint"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/m_per_s2"
        description: "Minimum and maximum transport speed m/s2"
        min: 0.0
        max: 20.0

      - type: collection
        id_short: "TargetPosition"
        elements:
          - type: range
            id_short: "XPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            min: 60.0
            max: 660
          - type: range
            id_short: "YPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            min: 60.0
            max: 900.0

      - type: property
        id_short: "ComponentReference"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/mm"
        description: "Minimum and maximum drill depth in mm"
        value: ""

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable operation label in multiple languages"
        value:
          dk: "Dette er en transport operation for en ressource"
          en: "This is a transport operation for a resource"

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Components this drilling station can process"
    element_type: "property"
    value_type: "xs:string"
    items:
      - "BottomCover_ALU"
      - "TopCover_ALU"
      - "Bottom_Cover_Drilled"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Materials that can be drilled by this capability"
    element_type: "property"
    value_type: "xs:string"
    items:
      - "PLA"
      - "ABS"

  - type: reference_element
    id_short: "ResourceReference"
    semantic_id: "https://aausmartlab.org/Semantics/ResourceReference"
    description: "Reference to the physical resource realizing this capability"
    value: "https://aausmartlab.org/Shells/Resources/Transport-12345678"
