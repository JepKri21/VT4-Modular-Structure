id_short: "Skills"
id: "https://aausmartlab.org/Shells/Resources/Transport_12345678/Skills"
description: "Submodel of skills and capabilities provided by this resource"
semantic_id: "https://aausmartlab.org/Semantics/SubmodelTypes/Skills"

elements:
  - type: collection
    id_short: "Transport"
    semantic_id: "https://aausmartlab.org/Semantics/Capability"
    description: "Name of skill offered by this resource"

    elements:
      - type: reference_element
        id_short: "CapabilitySubmodelReference"
        value: "https://aausmartlab.org/Shells/Resources/Transport_12345678/TransportCapabilityOffered"
      
      - type: reference_element
        id_short: "CapabilityTypeReference"
        semantic_id: "https://aausmartlab.org/Semantics/CapabilityTypeReference"
        description: "Reference to the corresponding CapabilityOffered type"
        value: "https://aausmartlab.org/Submodels/Capability/Transport"
  
      - type: list
        id_short: "SkillTriggers"
        semantic_id: "https://aausmartlab.org/Semantics/SkillTriggers"
        description: "Skill trigger commands for a given capability"
        element_type: "property"
        value_type: "xs:string"
        items:
          - "START"
          - "STOP"
          - "RESET"
          - "ABORT"
          - "CLEAR"
          - "HOLD"
          - "UNHOLD"
          - "SUSPEND"
          - "UNSUSPEND"

      - type: list
        id_short: "Actors"
        semantic_id: "https://aausmartlab.org/Semantics/Actors"
        description: "Actors involved in the execution of this capability"
        element_type: "property"
        value_type: "xs:string"
        items:
          - "Shuttle1"
          - "Shuttle2"
      