id_short: "PhoneAssemblyCapabilityOffered"
id: "https://aausmartlab.org/Shells/Resources/PhoneAssembler_12345678/PhoneAssemblyCapabilityOffered"
description: "Offered capability template for a drilling capability — parameters expressed as ranges defining the operational envelope"
semantic_id: "https://aausmartlab.org/Semantics/SubmodelTypes/Capability"

elements:
  - type: property
    id_short: "CapabilityCategory"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityCategory"
    description: "Describes the category of cabaility, whether it is offered by a resource or required by a product"
    value_type: "xs:string"
    value: "Offered"

  - type: property
    id_short: "CapabilityTypeReference"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityTypeReference"
    description: "Describes the specific capability offered by a resource or required by a product"
    value_type: "xs:string"
    value: "https://aausmartlab.org/Submodels/Capability/Assemble"

  - type: collection
    id_short: "Parameters"
    semantic_id: "https://aausmartlab.org/Semantics/Parameters"
    description: "Parameters defining the capability envelope"
    elements:
      - type: collection
        id_short: "TargetPosition"
        elements:
          - type: range
            id_short: "XPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Possible range of X-coordinate position of hole relative to product placement point"
            min: -50.0
            max: 50.0
          - type: range
            id_short: "YPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Possible range of Y-coordinate position of hole relative to product placement point"
            min: -50.0
            max: 50.0

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable operation label in multiple languages"
        value:
          dk: "Dette er en samle process for en ressource"
          en: "This is an assembly operation for a resource"

  - type: collection
    id_short: "ProcessTransformations"
    semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformations"
    description: "A collection of mappings between component inputs and resulting output"
    elements:
      - type: collection
        id_short: "BottomCoverPCBFuseAndTopCover"
        semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation"
        description: "A single mapping between component inputs and resulting output"
        elements:
          - type: collection
            id_short: "InputTypes"
            semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation/InputTypes"
            description: "A list of the components or assemblies that have to be used in the transformation"
            elements:
              - type: list
                id_short: "ComponentTypeReference"
                semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeReference"
                description: "A list of component type references"
                element_type: "property"
                value_type: "xs:string"
                items:
                  - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
                  - "https://aausmartlab.org/Shells/Component/TopCover"

          - type: collection
            id_short: "OutputTypes"
            semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation/OutputTypes"
            description: "A list of the components or assemblies that can have to be used in the transformation"
            elements:
              - type: list
                id_short: "ComponentTypeReference"
                semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeReference"
                description: "A list of component type references"
                element_type: "property"
                value_type: "xs:string"
                items:
                  - "https://aausmartlab.org/Shells/Product/MobilePhone"


  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Components this resource can process with this capability"
    element_type: "property"
    value_type: "xs:string"
    items:
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Materials that can be drilled by this capability"
    element_type: "property"
    value_type: "xs:string"
    items:
      - null

  - type: reference_element
    id_short: "ResourceReference"
    semantic_id: "https://aausmartlab.org/Semantics/ResourceReference"
    description: "Reference to the physical resource realizing this capability"
    value: "https://aausmartlab.org/Shells/Resources/PhoneAssembler_12345678"
