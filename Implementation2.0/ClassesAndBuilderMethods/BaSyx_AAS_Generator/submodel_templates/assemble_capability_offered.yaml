id_short: "AssembleCapabilityOffered"
id: "https://aausmartlab.org/Submodels/Templates/AssembleCapabilityOffered"
description: "Offered assembly capability — declares the assembly types, spatial envelope, and component types a resource can process"

elements:

  - type: property
    id_short: "CapabilityCategory"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityCategory"
    description: "Always 'Offered' for this template"
    cardinality: "One"

  - type: property
    id_short: "CapabilityReference"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityReference"
    description: "Semantic IRI identifying this as an Assemble capability"
    cardinality: "One"

  - type: collection
    id_short: "Parameters"
    semantic_id: "https://aausmartlab.org/Semantics/Parameters"
    description: "Parameters defining the assembly capability envelope"
    cardinality: "One"
    elements:

      - type: list
        id_short: "SupportedAssemblyTypes"
        semantic_id: "https://aausmartlab.org/Semantics/SupportedAssemblyTypes"
        description: "Assembly methods this resource supports (e.g. snap-fit, press-fit, screwing, welding)"
        element_type: "property"
        value_type: "xs:string"
        cardinality: "OneToMany"

      - type: collection
        id_short: "AssemblyPosition"
        description: "Reachable area in which this resource can perform assembly, relative to its placement point"
        cardinality: "One"
        elements:
          - type: range
            id_short: "XPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Reachable X range in mm"
            cardinality: "One"
          - type: range
            id_short: "YPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Reachable Y range in mm"
            cardinality: "One"

      - type: range
        id_short: "MaxComponentCount"
        value_type: "xs:integer"
        semantic_id: "https://aausmartlab.org/Semantics/MaxComponentCount"
        description: "Min and max number of components the resource can handle in a single assembly operation"
        cardinality: "One"

      - type: range
        id_short: "MaxAssemblyTimeS"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/MaxAssemblyTimeS"
        description: "Min and max assembly duration in seconds"
        cardinality: "One"

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable operation label in multiple languages"
        cardinality: "ZeroToOne"

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Component type URIs this resource is capable of handling during assembly"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Material type URIs compatible with this assembly capability"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"

  - type: reference_element
    id_short: "ResourceReference"
    semantic_id: "https://aausmartlab.org/Semantics/ResourceReference"
    description: "Reference to the AAS shell of the resource realizing this capability"
    cardinality: "One"
