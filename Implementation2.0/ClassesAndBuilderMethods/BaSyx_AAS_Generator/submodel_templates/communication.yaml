id_short: "Communication"
id: "https://aausmartlab.org/Submodels/Templates/Communication"
description: "MQTT communication parameters for a resource station â€” defines topic suffixes for the standard PackML messaging protocol"
semantic_id: "https://aausmartlab.org/Semantics/SubmodelTypes/Communication"

elements:

  - type: collection
    id_short: "MQTT"
    description: "MQTT configuration for this resource"
    cardinality: "One"
    elements:

      - type: property
        id_short: "ProductionLinePrefix"
        value_type: "xs:string"
        description: "Prefix of the production line connected to a line controller. Starts empty and is popoulated when the resource is added to a line configuration."
        cardinality: "One"
        semantic_id: "https://aausmartlab.org/Semantics/MQTTBrokerPrefix"

      - type: property
        id_short: "BrokerID"
        value_type: "xs:string"
        description: "ID of the broker that is used by the production line."
        cardinality: "One"
        semantic_id: "https://aausmartlab.org/Semantics/MQTTBrokerID"

      - type: property
        id_short: "BrokerPort"
        value_type: "xs:integer"
        description: "Port used for the Production Line's MQTT broker"
        cardinality: "One"
        semantic_id: "https://aausmartlab.org/Semantics/MQTTBrokerPort"

      - type: collection
        id_short: "Suffixes"
        description: "Topic suffix definitions â€” full topic is <ProductionLinePrefix>/<ResourceID>/<Suffix>"
        cardinality: "One"
        elements:

          - type: property
            id_short: "CommandSuffix"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/CommandSuffix"
            description: "Suffix for command topics â€” controller sends PackML commands here"
            cardinality: "One"

          - type: property
            id_short: "StateSuffix"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/StateSuffix"
            description: "Suffix for state topics â€” resource publishes PackML state changes here"
            cardinality: "One"

          - type: property
            id_short: "JobResultSuffix"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/JobResultSuffix"
            description: "Suffix for job result topics â€” resource publishes job outcomes here"
            cardinality: "One"

          - type: property
            id_short: "InfoRequestSuffix"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/InfoRequestSuffix"
            description: "Suffix for info request topics â€” controller requests state republish here"
            cardinality: "One"

          - type: property
            id_short: "ResourceAcknowledgementSuffix"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/ResourceAcknowledgementSuffix"
            description: "Suffix for resource acknowledgement topics â€” resource confirms receipt of commands"
            cardinality: "One"

          - type: property
            id_short: "ControllerAcknowledgementSuffix"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/ControllerAcknowledgementSuffix"
            description: "Suffix for controller acknowledgement topics â€” controller confirms receipt of results"
            cardinality: "One"

          - type: property
            id_short: "OccupancySuffix"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/OccupancySuffix"
            description: "Suffix for occupancy topics â€” resource reports whether its work zone is occupied"
            cardinality: "One"

          - type: property
            id_short: "InventoryLevelSuffix"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/InventoryLevelSuffix"
            description: "Suffix for inventory level topics â€” only required for storage-type resources"
            cardinality: "ZeroToOne"
