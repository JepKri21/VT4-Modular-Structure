id_short: "BillOfMaterials"
id: "https://aausmartlab.org/Submodels/Templates/BillOfMaterials"
description: "Bill of Materials submodel template - generic for components, sub-assemblies and final products"
semantic_id: "https://aausmartlab.org/Semantics/SubmodelTypes/BillOfMaterials"

elements:
  - type: collection
    id_short: "BOMEntries"
    semantic_id: "https://aausmartlab.org/Semantics/BOMEntries"
    description: "Container for all BOM entries"
    cardinality: "One"
    extensible: true
    entry_template: "{Description}_{N}"
    elements:
      - type: collection
        id_short: "BOMEntry"
        semantic_id: "https://aausmartlab.org/Semantics/BOMEntry"
        description: "Template entry - one collection per required component"
        cardinality: "OneToMany"
        elements:
          - type: property
            id_short: "Description"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/Description"
            description: "Human-readable description of the component"
            cardinality: "One"

          - type: property
            id_short: "Quantity"
            value_type: "xs:integer"
            semantic_id: "https://aausmartlab.org/Semantics/Quantity"
            description: "Number of this component required"
            cardinality: "One"
            qualifiers:
              - type: "range_min"
                value_type: "xs:integer"
                value: 1
                kind: "TEMPLATE_QUALIFIER"

          - type: reference_element
            id_short: "ComponentTypeReference"
            semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeReference"
            description: "Reference to the type of component"
            cardinality: "One"
            reference_type: "model"

          - type: reference_element
            id_short: "ComponentShellReference"
            semantic_id: "https://aausmartlab.org/Semantics/ComponentShellReference"
            description: "Reference to the actual component instance used - empty at creation, filled during production"
            cardinality: "One"
            reference_type: "model"

          - type: reference_element
            id_short: "RequiredPropertiesReference"
            semantic_id: "https://aausmartlab.org/Semantics/RequiredPropertiesReference"
            description: "Reference to the RequiredProperties submodel on this shell holding the desired configuration for this entry, as specified by the MES order"
            cardinality: "ZeroToOne"
            reference_type: "model"


