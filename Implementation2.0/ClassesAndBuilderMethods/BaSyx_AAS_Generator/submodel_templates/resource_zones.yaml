    description: "Zones that serve as both input and output — used for component handoff"
    extensible: true
    entry_template: "Zone{N}"
    cardinality: "ZeroToMany"
    elements:
      - type: collection
        id_short: "Zone"
        description: "A zone defined by four corner points"
        cardinality: "One"
        elements:
          - type: collection
            id_short: "Point1"
            cardinality: "One"
            elements:
              - type: property
                id_short: "XPos"
                value_type: "xs:float"
                cardinality: "One"
              - type: property
                id_short: "YPos"
                value_type: "xs:float"
                cardinality: "One"
          - type: collection
            id_short: "Point2"
            cardinality: "One"
            elements:
              - type: property
                id_short: "XPos"
                value_type: "xs:float"
                cardinality: "One"
              - type: property
                id_short: "YPos"
                value_type: "xs:float"
                cardinality: "One"
          - type: collection
            id_short: "Point3"
            cardinality: "One"
            elements:
              - type: property
                id_short: "XPos"
                value_type: "xs:float"
                cardinality: "One"
              - type: property
                id_short: "YPos"
                value_type: "xs:float"
                cardinality: "One"
          - type: collection
            id_short: "Point4"
            cardinality: "One"
            elements:
              - type: property
                id_short: "XPos"
                value_type: "xs:float"
                cardinality: "One"
              - type: property
                id_short: "YPos"
                value_type: "xs:float"
