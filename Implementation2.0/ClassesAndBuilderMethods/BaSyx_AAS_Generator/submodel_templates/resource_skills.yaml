id_short: "Skills"
id: "https://aausmartlab.org/Submodels/Templates/Skills"
description: "Skills submodel template â€” one extensible entry per capability offered by the resource"

elements:

  - type: collection
    id_short: "Skill"
    semantic_id: "https://aausmartlab.org/Semantics/Capability"
    description: "Skill entries for all offered capabilities"
    extensible: true
    entry_template: "{SkillName}"
    elements:

      - type: property
        id_short: "SkillName"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/SkillName"
        description: "Name of this skill (e.g. Drilling, Handoff, Store, Retrieve, Assemble)"
        cardinality: "One"

      - type: reference_element
        id_short: "CapabilitySubmodelReference"
        semantic_id: "https://aausmartlab.org/Semantics/CapabilitySubmodelReference"
        description: "Reference to the corresponding CapabilityOffered submodel"
        cardinality: "One"

      - type: list
        id_short: "SkillTriggers"
        semantic_id: "https://aausmartlab.org/Semantics/SkillTriggers"
        description: "Trigger commands for this skill (ISA-88: START, STOP, RESET, ABORT, CLEAR, HOLD, UNHOLD, SUSPEND, UNSUSPEND)"
        element_type: "property"
        value_type: "xs:string"
        cardinality: "OneToMany"

      - type: list
        id_short: "Actors"
        semantic_id: "https://aausmartlab.org/Semantics/Actors"
        description: "Physical actors that execute this skill (e.g. KUKAManipulator, UR5)"
        element_type: "property"
        value_type: "xs:string"
        cardinality: "OneToMany"
