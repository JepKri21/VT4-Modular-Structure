id_short: "AssembleCapabilityRequired"
id: "https://aausmartlab.org/Submodels/Templates/AssembleCapabilityRequired"
description: "Required assembly capability — specifies the exact assembly position and the input/output component type transformation needed for a product assembly step"
semantic_id: "https://aausmartlab.org/Semantics/SubmodelTypes/Capability"

elements:

  - type: property
    id_short: "CapabilityCategory"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityCategory"
    description: "Always 'Required' for this template"
    value: "Required"
    cardinality: "One"

  - type: property
    id_short: "CapabilityTypeReference"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityTypeReference"
    description: "Semantic IRI identifying this as an Assemble capability"
    value: "https://aausmartlab.org/Submodels/Capability/Assemble"
    cardinality: "One"

  - type: collection
    id_short: "Parameters"
    semantic_id: "https://aausmartlab.org/Semantics/Parameters"
    description: "Exact parameters required to execute this assembly step"
    cardinality: "One"
    elements:

      - type: collection
        id_short: "TargetPosition"
        semantic_id: "https://aausmartlab.org/Semantics/TargetPosition"
        description: "Exact X/Y position where assembly must take place"
        cardinality: "ZeroToOne"
        elements:
          - type: property
            id_short: "XPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/Parameter/XPos"
            description: "Required X-coordinate in mm"
            cardinality: "One"
            qualifiers:
              - type: "unit"
                value_type: "xs:string"
                value: "mm"
                kind: "CONCEPT_QUALIFIER"
          - type: property
            id_short: "YPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/Parameter/YPos"
            description: "Required Y-coordinate in mm"
            cardinality: "One"
            qualifiers:
              - type: "unit"
                value_type: "xs:string"
                value: "mm"
                kind: "CONCEPT_QUALIFIER"

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable label for this assembly step"
        cardinality: "One"

  - type: collection
    id_short: "ProcessTransformations"
    semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformations"
    description: "The specific input-to-output component transformation required by this step"
    cardinality: "One"
    extensible: true
    entry_template: "{Name}"
    elements:

      - type: collection
        id_short: "Transformation1"
        semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation"
        description: "A single input-to-output component type mapping"
        cardinality: "One"
        elements:
          - type: collection
            id_short: "InputTypes"
            semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation/InputTypes"
            description: "Component or assembly type URIs required as inputs"
            cardinality: "One"
            elements:
              - type: list
                id_short: "ComponentTypeReference"
                semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeReference"
                description: "Type IRIs of the input components or assemblies"
                element_type: "property"
                value_type: "xs:string"
          - type: collection
            id_short: "OutputTypes"
            semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation/OutputTypes"
            description: "Component or assembly type URIs produced"
            cardinality: "One"
            elements:
              - type: list
                id_short: "ComponentTypeReference"
                semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeReference"
                description: "Type IRIs of the output components or assemblies"
                element_type: "property"
                value_type: "xs:string"

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Component type URIs this step applies to — used for capability matching"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"
