id_short: "AssembleCapabilityRequired"
id: "https://aausmartlab.org/Submodels/Templates/AssembleCapabilityRequired"
description: "Required assembly capability — specifies the exact assembly operation, component types and runtime instances, and spatial target for a product assembly step"

elements:

  - type: collection
    id_short: "AssemblyParameters"
    semantic_id: "https://aausmartlab.org/Semantics/AssemblyParameters"
    description: "Exact parameters required to execute this assembly step"
    cardinality: "One"
    elements:

      - type: property
        id_short: "AssemblyType"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/AssemblyType"
        description: "Exact assembly method required (e.g. snap-fit, press-fit, screwing, welding)"
        cardinality: "One"

      - type: collection
        id_short: "AssemblyPosition"
        description: "Exact X/Y position (mm) where assembly must take place, relative to the resource placement point"
        cardinality: "One"
        elements:
          - type: property
            id_short: "XPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Required X-coordinate in mm"
            cardinality: "One"
          - type: property
            id_short: "YPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Required Y-coordinate in mm"
            cardinality: "One"

      - type: property
        id_short: "MaxAssemblyTime_s"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/MaxAssemblyTime_s"
        description: "Maximum time allowed for this assembly step in seconds"
        cardinality: "ZeroToOne"

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable label for this assembly step"
        cardinality: "ZeroToOne"

  - type: collection
    id_short: "NeededComponents"
    semantic_id: "https://aausmartlab.org/Semantics/NeededComponents"
    description: "Components and sub-assemblies required for this step, with type-level refs (design-time) and instance refs (runtime)"
    cardinality: "One"
    extensible: true
    min_entries: 2
    entry_template: "Component{N}"
    elements:

      - type: collection
        id_short: "Component1"
        semantic_id: "https://aausmartlab.org/Semantics/Component1"
        description: "First required component or sub-assembly"
        cardinality: "One"
        elements:
          - type: property
            id_short: "ComponentTypeRef"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeRef"
            description: "URI of the AAS shell type identifying the component type (set at design time)"
            cardinality: "One"
          - type: reference_element
            id_short: "ComponentInstanceRef"
            semantic_id: "https://aausmartlab.org/Semantics/ComponentInstanceRef"
            description: "AAS shell reference to the specific component instance to use — filled by orchestrator at runtime"
            cardinality: "ZeroToOne"
          - type: property
            id_short: "Quantity"
            value_type: "xs:integer"
            semantic_id: "https://aausmartlab.org/Semantics/Quantity"
            description: "Number of this component needed"
            cardinality: "One"

  - type: property
    id_short: "OutputProductTypeRef"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/OutputProductTypeRef"
    description: "URI of the AAS shell type that this assembly step produces"
    cardinality: "ZeroToOne"

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Component type URIs this step applies to — used for capability matching"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Material type URIs involved in this assembly step"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"
