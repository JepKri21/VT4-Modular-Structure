id_short: "Inventory"
id: "https://aausmartlab.org/Submodels/Templates/Inventory"
description: "Inventory submodel for a storage resource â€” one entry per physical storage slot or rack"
semantic_id: "https://aausmartlab.org/Semantics/SubmodelTypes/Inventory"

elements:

  - type: collection
    id_short: "Inventories"
    semantic_id: "https://aausmartlab.org/Semantics/Inventories"
    description: "All physical inventory slots or racks on this resource"
    cardinality: "One"
    extensible: true
    entry_template: "Inventory_{N}"
    elements:

      - type: collection
        id_short: "Inventory"
        semantic_id: "https://aausmartlab.org/Semantics/Inventory"
        description: "One entry per physical inventory slot or rack (duplicate this collection for each)"
        cardinality: "OneToMany"
        elements:

          - type: collection
            id_short: "Specifications"
            semantic_id: "https://aausmartlab.org/Semantics/Parameters"
            description: "Physical specifications of this inventory slot"
            cardinality: "One"
            elements:

              - type: property
                id_short: "InventorySize"
                value_type: "xs:integer"
                semantic_id: "https://aausmartlab.org/Semantics/InventorySize"
                description: "Maximum number of components this slot can hold"
                cardinality: "One"

          - type: list
            id_short: "SupportedComponents"
            semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
            description: "Component types that can be stored in this inventory slot"
            element_type: "property"
            value_type: "xs:string"
            cardinality: "OneToMany"

          - type: list
            id_short: "Actors"
            semantic_id: "https://aausmartlab.org/Semantics/Actors"
            description: "Actor IDs on this resource that can access this inventory slot"
            element_type: "property"
            value_type: "xs:string"
            cardinality: "OneToMany"

          - type: collection
            id_short: "StoredComponents"
            semantic_id: "https://aausmartlab.org/Semantics/StoredComponents"
            description: "Component types that can be stored in this inventory slot"
            cardinality: "One"
            extensible: true
            entry_template: "SlotEntry_{N}"
            elements:
              - type: collection
                id_short: "SlotEntry"
                semantic_id: "https://aausmartlab.org/Semantics/SlotEntry"
                description: "Template entry - one collection per required component"
                cardinality: "OneToMany"
                elements:
                  - type: property
                    id_short: "SlotReserved"
                    value_type: "xs:boolean"
                    semantic_id: "https://aausmartlab.org/Semantics/SlotReserved"
                    description: "A true or false used to reserve a component for a job"
                    cardinality: "One"

                  - type: reference_element
                    id_short: "ComponentShellReference"
                    semantic_id: "https://aausmartlab.org/Semantics/ComponentInstanceRef"
                    description: "Reference to the actual component instance used - empty at creation, filled during production"
                    cardinality: "One"
                    reference_type: "model"
                    reference_target: "shell"
            
            


