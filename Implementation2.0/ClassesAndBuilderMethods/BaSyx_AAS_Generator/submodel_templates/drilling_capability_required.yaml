id_short: "DrillingCapabilityRequired"
id: "https://aausmartlab.org/Submodels/Templates/DrillingCapabilityRequired"
description: "Required capability template for a product process step â€” parameters expressed as exact property values to be matched against an offered capability"

elements:
  - type: property
    id_short: "CapabilityCategory"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityCategory"
    description: "Always 'Required' for this template"
    cardinality: "One"

  - type: property
    id_short: "CapabilityTypeReference"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityTypeReference"
    description: "Semantic IRI identifying this as a Drilling capability"
    value: "https://aausmartlab.org/Submodels/Capability/Drilling"
    cardinality: "One"

  - type: collection
    id_short: "Parameters"
    semantic_id: "https://aausmartlab.org/Semantics/Parameters"
    description: "Exact drilling parameters required to process this product"
    cardinality: "One"
    elements:
      - type: property
        id_short: "HoleDiameter"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/mm"
        description: "Required hole diameter in mm"
        cardinality: "One"

      - type: property
        id_short: "DrillDepth"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/mm"
        description: "Required drill depth in mm"
        cardinality: "ZeroToOne"

      - type: collection
        id_short: "TargetPosition"
        semantic_id: "https://aausmartlab.org/Semantics/TargetPosition"
        description: "Required hole placement position relative to the product placement point"
        cardinality: "ZeroToOne"
        elements:
          - type: property
            id_short: "XPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "X-coordinate of hole position in mm"
            cardinality: "One"
          - type: property
            id_short: "YPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/mm"
            description: "Y-coordinate of hole position in mm"
            cardinality: "One"

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable operation label in multiple languages"
        cardinality: "One"

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Component types this step applies to"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Materials the product component is made of"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"