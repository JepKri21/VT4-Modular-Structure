id_short: "Documentation"
id: "https://aausmartlab.org/Submodels/Templates/ProductDocumentation"
description: "Documentation submodel template — generic human-readable reference information for products, assemblies and components"

elements:
  - type: collection
    id_short: "ProductionIdentification"
    semantic_id: "https://aausmartlab.org/Semantics/ProductionIdentification"
    description: "Identification labels for routing and traceability"
    cardinality: "One"
    elements:
      - type: property
        id_short: "ModelNumber"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/ModelNumber"
        description: "Model number — drives BOM and BOP selection"
        cardinality: "One"

      - type: property
        id_short: "HardwareRevision"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/HardwareRevision"
        description: "Design revision — a change may imply a different BOM or BOP"
        cardinality: "ZeroToOne"

      - type: property
        id_short: "SerialNumber"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/SerialNumber"
        description: "Unique serial number for this physical instance"
        cardinality: "ZeroToOne"

      - type: property
        id_short: "BatchNumber"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/BatchNumber"
        description: "Production batch identifier for traceability"
        cardinality: "ZeroToOne"

  - type: multi_language_property
    id_short: "DisplayName"
    semantic_id: "https://aausmartlab.org/Semantics/DisplayName"
    description: "Human-readable product name in one or more languages"
    cardinality: "One"

  - type: multi_language_property
    id_short: "Description"
    semantic_id: "https://aausmartlab.org/Semantics/Description"
    description: "Free-text description of the product and its role"
    cardinality: "One"

  - type: property
    id_short: "ProductFamily"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/ProductFamily"
    description: "Product family this product belongs to"
    cardinality: "ZeroToOne"

  - type: property
    id_short: "ManufacturerName"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/ManufacturerName"
    description: "Name of the manufacturer"
    cardinality: "ZeroToOne"

  - type: reference_element
    id_short: "DatasheetRef"
    semantic_id: "https://aausmartlab.org/Semantics/DatasheetRef"
    description: "Reference to the datasheet or technical drawing"
    cardinality: "ZeroToOne"

  - type: reference_element
    id_short: "CertificationRef"
    semantic_id: "https://aausmartlab.org/Semantics/CertificationRef"
    description: "Reference to compliance or certification documentation (e.g. CE, RoHS)"
    cardinality: "ZeroToOne"

  - type: reference_element
    id_short: "AssemblyInstructionsRef"
    semantic_id: "https://aausmartlab.org/Semantics/AssemblyInstructionsRef"
    description: "Reference to the assembly instructions document"
    cardinality: "ZeroToOne"

  - type: reference_element
    id_short: "ParentProductRef"
    semantic_id: "https://aausmartlab.org/Semantics/ParentProductRef"
    description: "Reference to the parent product type (if this is a variant)"
    cardinality: "ZeroToOne"
