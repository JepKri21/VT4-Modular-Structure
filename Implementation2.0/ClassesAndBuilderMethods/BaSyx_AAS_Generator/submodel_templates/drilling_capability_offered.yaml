id_short: "DrillingCapabilityOffered"
id: "https://aausmartlab.org/Submodels/Templates/DrillingCapabilityOffered"
description: "Offered capability template for a drilling resource â€” parameters expressed as ranges defining the operational envelope"
semantic_id: "https://aausmartlab.org/Semantics/SubmodelTypes/Capability"

elements:

  - type: property
    id_short: "CapabilityCategory"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityCategory"
    description: "Always 'Offered' for this template"
    cardinality: "One"

  - type: property
    id_short: "CapabilityTypeReference"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.org/Semantics/CapabilityTypeReference"
    description: "Semantic IRI identifying this as a Drilling capability"
    value: "https://aausmartlab.org/Submodels/Capability/Drilling"
    cardinality: "One"

  - type: collection
    id_short: "Parameters"
    semantic_id: "https://aausmartlab.org/Semantics/Parameters"
    description: "Parameters defining the drilling capability envelope"
    cardinality: "One"
    elements:

      - type: property
        id_short: "HoleDiameter"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/Parameter/HoleDiameter"
        description: "Drill bit diameter in mm"
        cardinality: "One"
        qualifiers:
          - type: "range_min"
            value_type: "xs:float"
            value: 1.0
            kind: "TEMPLATE_QUALIFIER"
          - type: "range_max"
            value_type: "xs:float"
            value: 20.0
            kind: "TEMPLATE_QUALIFIER"
          - type: "unit"
            value_type: "xs:string"
            value: "mm"
            kind: "CONCEPT_QUALIFIER"

      - type: range
        id_short: "DrillDepth"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/Parameter/DrillDepth"
        description: "Minimum and maximum drill depth in mm"
        cardinality: "One"
        qualifiers:
          - type: "unit"
            value_type: "xs:string"
            value: "mm"
            kind: "CONCEPT_QUALIFIER"

      - type: collection
        id_short: "TargetPosition"
        semantic_id: "https://aausmartlab.org/Semantics/TargetPosition"
        description: "Reachable hole placement area relative to the product placement point"
        cardinality: "One"
        elements:
          - type: range
            id_short: "XPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/Parameter/XPos"
            description: "X range of hole placement in mm"
            cardinality: "One"
            qualifiers:
              - type: "unit"
                value_type: "xs:string"
                value: "mm"
                kind: "CONCEPT_QUALIFIER"
          - type: range
            id_short: "YPos"
            value_type: "xs:float"
            semantic_id: "https://aausmartlab.org/Semantics/Parameter/YPos"
            description: "Y range of hole placement in mm"
            cardinality: "One"
            qualifiers:
              - type: "unit"
                value_type: "xs:string"
                value: "mm"
                kind: "CONCEPT_QUALIFIER"

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable operation label in multiple languages"
        cardinality: "One"

  - type: collection
    id_short: "ProcessTransformations"
    semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformations"
    description: "Mappings between component input types and the resulting output type this resource can produce"
    cardinality: "One"
    extensible: true
    entry_template: "{Name}"
    elements:

      - type: collection
        id_short: "Transformation1"
        semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation"
        description: "A single input-to-output component type mapping"
        cardinality: "One"
        elements:
          - type: collection
            id_short: "InputTypes"
            semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation/InputTypes"
            description: "Component or assembly type URIs required as inputs for this transformation"
            cardinality: "One"
            elements:
              - type: list
                id_short: "ComponentTypeReference"
                semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeReference"
                description: "Type IRIs of the input components or assemblies"
                element_type: "property"
                value_type: "xs:string"
          - type: collection
            id_short: "OutputTypes"
            semantic_id: "https://aausmartlab.org/Semantics/ProcessTransformation/OutputTypes"
            description: "Component or assembly type URIs produced by this transformation"
            cardinality: "One"
            elements:
              - type: list
                id_short: "ComponentTypeReference"
                semantic_id: "https://aausmartlab.org/Semantics/ComponentTypeReference"
                description: "Type IRIs of the output components or assemblies"
                element_type: "property"
                value_type: "xs:string"

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Components this drilling station can process"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Materials that can be drilled by this capability"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"

  - type: reference_element
    id_short: "ResourceReference"
    semantic_id: "https://aausmartlab.org/Semantics/ResourceReference"
    description: "Reference to the AAS shell of the resource realizing this capability"
    cardinality: "One"
    reference_type: "model"
    reference_target: "shell"
