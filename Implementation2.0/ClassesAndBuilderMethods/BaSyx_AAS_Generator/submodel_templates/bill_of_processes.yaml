id_short: "BillOfProcesses"
id: "https://aausmartlab.org/Submodels/Templates/BillOfProcesses"
description: "Bill of Processes submodel template — generic process definition and tracking for assemblies and final products"

elements:
  - type: collection
    id_short: "ProcessTracking"
    semantic_id: "https://aausmartlab.org/Semantics/ProcessTracking"
    description: "Runtime execution tracking — one record per process step"
    cardinality: "ZeroToOne"
    extensible: true
    entry_template: "{StepRef}_{N}"
    elements:
      - type: collection
        id_short: "StepRecord"
        semantic_id: "https://aausmartlab.org/Semantics/StepRecord"
        description: "Execution record for a single process step"
        cardinality: "OneToMany"
        elements:
          - type: property
            id_short: "StepRef"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/StepRef"
            description: "id_short of the corresponding ProcessStep"
            cardinality: "One"

          - type: property
            id_short: "StepStatus"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/StepStatus"
            description: "Execution status (Pending, InProgress, Completed, Failed)"
            cardinality: "One"

          - type: property
            id_short: "ExecutedBy"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/ExecutedBy"
            description: "id_short of the station or operator that executed this step"
            cardinality: "ZeroToOne"

          - type: property
            id_short: "StartTime"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/StartTime"
            description: "ISO 8601 timestamp when this step started"
            cardinality: "ZeroToOne"

          - type: property
            id_short: "CompletionTime"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/CompletionTime"
            description: "ISO 8601 timestamp when this step completed"
            cardinality: "ZeroToOne"

  - type: collection
    id_short: "ProcessSteps"
    semantic_id: "https://aausmartlab.org/Semantics/ProcessSteps"
    description: "Container for all process steps"
    cardinality: "One"
    extensible: true
    entry_template: "{Operation}_{N}"
    elements:
      - type: collection
        id_short: "ProcessStep"
        semantic_id: "https://aausmartlab.org/Semantics/ProcessStep"
        description: "Template entry — one collection per process step"
        cardinality: "OneToMany"
        elements:
          - type: property
            id_short: "Operation"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/Operation"
            description: "Operation type"
            cardinality: "One"

          - type: list
            id_short: "RequiredComponents"
            element_type: "reference_element"
            reference_type: "model"
            semantic_id: "https://aausmartlab.org/Semantics/RequiredComponents"
            description: "References to BOM entries consumed by this step"
            cardinality: "OneToMany"

          - type: collection
            id_short: "Constraints"
            semantic_id: "https://aausmartlab.org/Semantics/Constraints"
            description: "Steps that must complete before this step can start"
            cardinality: "ZeroToOne"
            extensible: true
            entry_template: "Constraint_{N}"
            elements:
              - type: property
                id_short: "PredecessorStep"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/PredecessorStep"
                description: "Step that must complete before this step can start"
                cardinality: "One"
                ref_source: "process_steps"

          - type: reference_element
            id_short: "RequiredCapabilityReference"
            semantic_id: "https://aausmartlab.org/Semantics/RequiredCapabilityReference"
            description: "Reference to the required capability submodel instance for this step"
            cardinality: "ZeroToOne"
            reference_type: "model"

          - type: collection
            id_short: "StepConstraints"
            semantic_id: "https://aausmartlab.org/Semantics/StepConstraints"
            description: "Optional constraints an orchestrator must satisfy before dispatching this step"
            cardinality: "ZeroToOne"
            elements:
              - type: property
                id_short: "RequiredStation"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/RequiredStation"
                description: "id_short of the specific station this step must run on"
                cardinality: "ZeroToOne"

              - type: property
                id_short: "MaxDurationS"
                value_type: "xs:integer"
                semantic_id: "https://aausmartlab.org/Semantics/MaxDurationS"
                description: "Maximum allowed duration for this step in seconds"
                cardinality: "ZeroToOne"

              - type: property
                id_short: "MaxWaitAfterS"
                value_type: "xs:integer"
                semantic_id: "https://aausmartlab.org/Semantics/MaxWaitAfterS"
                description: "Maximum seconds allowed between this step completing and the next step starting"
                cardinality: "ZeroToOne"

              - type: property
                id_short: "RequiresInspection"
                value_type: "xs:boolean"
                semantic_id: "https://aausmartlab.org/Semantics/RequiresInspection"
                description: "If true the step output must pass a quality inspection before the next step can start"
                cardinality: "ZeroToOne"

              - type: property
                id_short: "RequiredComponentState"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/RequiredComponentState"
                description: "State the component must be in before this step can start (e.g. Drilled, Cleaned)"
                cardinality: "ZeroToOne"
