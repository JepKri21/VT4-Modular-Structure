id_short: "BaseCapabilityOffered"
id: "https://aausmartlab.org/Submodels/Templates/BaseCapabilityOffered"
description: "Base structure for all CapabilityOffered submodels — extend with resource-specific parameters inside the Parameters collection"

elements:

  - type: collection
    id_short: "Parameters"
    semantic_id: "https://aausmartlab.org/Semantics/Parameters"
    description: "Parameters defining the capability envelope — add resource-specific entries here"
    cardinality: "One"
    elements:

      # REQUIRED in every capability: human-readable label shown in the UI
      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable operation label in multiple languages"
        cardinality: "One"

      # OPTIONAL — add resource-specific parameters below this line.
      # Examples:
      #   Drilling  → BitDiameter_mm (property/range), DrillDepth_mm (range),
      #               SpindleSpeed_RPM (range), SpindleFeed_mm_per_s (range),
      #               HolePlacement_x_mm (range), HolePlacement_y_mm (range)
      #   Transport → SpeedConstraint_m_per_s (range), AccelerationConstraint_m_per_s2 (range),
      #               TargetPosition (collection of XPos/YPos ranges)
      #   Store / Retrieve → no additional parameters beyond OperationLabel

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Component types this capability can process"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "OneToMany"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Materials compatible with this capability"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "OneToMany"

  - type: reference_element
    id_short: "ResourceReference"
    semantic_id: "https://aausmartlab.org/Semantics/ResourceReference"
    description: "Reference to the AAS shell of the resource realizing this capability"
    cardinality: "One"
