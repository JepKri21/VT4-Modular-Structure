shell: "resource_shell"
label: "Storage Station – AAU Lab"
description: "UR5 storage station with store, retrieve, and handoff capabilities"

asset_name: "Storage"

submodels:
  StoreCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityReference: "https://aausmartlab.org/Submodels/Capability/Store"
    SupportedComponents:
      - "BottomCover_ALU"
      - "TopCover_ALU"
      - "Bottom_Cover_Drilled"
    AllowedMaterials:
      - "PLA"
      - "ABS"

  RetrieveCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityReference: "https://aausmartlab.org/Submodels/Capability/Retrieve"
    SupportedComponents:
      - "BottomCover_ALU"
      - "TopCover_ALU"
      - "Bottom_Cover_Drilled"
    AllowedMaterials:
      - "PLA"
      - "ABS"

  HandoffCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
    SupportedComponents:
      - "BottomCover_ALU"
      - "TopCover_ALU"
      - "Bottom_Cover_Drilled"
    AllowedMaterials:
      - "PLA"
      - "ABS"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Skill:
      - SkillName: "Store"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage/StoreCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "UR5"
      - SkillName: "Retrieve"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage/RetrieveCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "UR5"
      - SkillName: "Handoff"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage/HandoffCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "UR5"

  Inventory:
    Inventories:
      - Specifications:
          InventorySize: 10
        SupportedComponents:
          - "Bottom_Cover"
          - "Top_Cover"
      - Specifications:
          InventorySize: 5
        SupportedComponents:
          - "Bottom_Cover_Drilled"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -60.0, YPos: -60.0 }
      Point2: { XPos:  60.0, YPos: -60.0 }
      Point3: { XPos:  60.0, YPos:  60.0 }
      Point4: { XPos: -60.0, YPos:  60.0 }
    InOutputZones:
      - Point1: { XPos: -50.0, YPos:  60.0 }
        Point2: { XPos:  50.0, YPos:  60.0 }
        Point3: { XPos:  50.0, YPos: 150.0 }
        Point4: { XPos: -50.0, YPos: 150.0 }

  Communication:
    MQTT:
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
        InventoryLevelSuffix: "InventoryLevel"
