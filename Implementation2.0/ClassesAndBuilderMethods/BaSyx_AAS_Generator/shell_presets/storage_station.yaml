type: "storage_module"
label: "Storage Station – AAU Lab"
description: "UR5 storage station with store, retrieve, and handoff capabilities"

asset_name: "Storage"

submodels:
  StoreCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Store"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
    Parameters:
      OperationLabel:
        en: "Store operation"
        dk: "Lageroperation"

  RetrieveCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Retrieve"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
    Parameters:
      OperationLabel:
        en: "Retrieve operation"
        dk: "Henteoperation"

  HandoffCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        en: "Handoff operation"
        dk: "Afleveringsoperation"

  Skills:
    Store:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage/StoreCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Store"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "UR5"
    Retrieve:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage/RetrieveCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Retrieve"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "UR5"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "UR5"

  Inventory:
    Inventories:
      - Specifications:
          InventorySize: 10
        SupportedComponents:
          - "https://aausmartlab.org/Shells/Component/BottomCover"
          - "https://aausmartlab.org/Shells/Component/TopCover"
        Actors:
          - "UR5"
      - Specifications:
          InventorySize: 5
        SupportedComponents:
          - "https://aausmartlab.org/Shells/Product/MobilePhone"
        Actors:
          - "UR5"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -600.0, YPos: -600.0 }
      Point2: { XPos: 600.0, YPos: -600.0 }
      Point3: { XPos: 600.0, YPos: 600.0 }
      Point4: { XPos: -600.0, YPos: 600.0 }
    InOutputZones:
      - Point1: { XPos: -500.0, YPos: 600.0 }
        Point2: { XPos: 500.0, YPos: 600.0 }
        Point3: { XPos: 500.0, YPos: 1500.0 }
        Point4: { XPos: -500.0, YPos: 1500.0 }

  Communication:
    MQTT:
      ProductionLinePrefix: ""
      BrokerID: ""
      BrokerPort: ""
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
        InventoryLevelSuffix: "InventoryLevel"
