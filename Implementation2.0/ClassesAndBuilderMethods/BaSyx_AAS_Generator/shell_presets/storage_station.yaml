      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage-12345678/RetrieveCapabilityOffered"
      Actors:
        - "UR5"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage-12345678/HandoffCapabilityOffered"
      Actors:
        - "UR5"
    Store:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage-12345678/StoreCapabilityOffered"
