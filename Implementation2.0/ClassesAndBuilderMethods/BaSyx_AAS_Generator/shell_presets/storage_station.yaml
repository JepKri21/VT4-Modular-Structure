shell: "resource_shell"
label: "Storage Station – AAU Lab (Storage_12345678)"
description: "UR5 storage station with store, retrieve, and handoff capabilities"

asset_name: "Storage_12345678"

submodels:
  StoreCapabilityOffered:
    SupportedComponents:
      - "BottomCover_ALU"
      - "TopCover_ALU"
      - "Bottom_Cover_Drilled"
    AllowedMaterials:
      - "PLA"
      - "ABS"

  RetrieveCapabilityOffered:
    SupportedComponents:
      - "BottomCover_ALU"
      - "TopCover_ALU"
      - "Bottom_Cover_Drilled"
    AllowedMaterials:
      - "PLA"
      - "ABS"

  HandoffCapabilityOffered:
    SupportedComponents:
      - "BottomCover_ALU"
      - "TopCover_ALU"
      - "Bottom_Cover_Drilled"
    AllowedMaterials:
      - "PLA"
      - "ABS"

  Skills:
