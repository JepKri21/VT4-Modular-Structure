type: "assembly_module"
label: "Assembly Module – Screwing (AAU Lab)"
description: "KUKA manipulator torque-controlled screwing station for fastening Fuse Module and PCB sub-assemblies to Bottom Cover."

asset_name: "AssemblyScrewing"

submodels:
  AssembleCapabilityOffered:
    CapabilityCategory: "Offered"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
      - "https://aausmartlab.org/Shells/Assembly/FuseModule"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        - language: "en"
          text: "Screwing assembly operation"
        - language: "da"
          text: "Skruesamling"
    ProcessTransformations:
      BottomCoverPCBAndFuse:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
            - "https://aausmartlab.org/Shells/Assembly/FuseModule"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
      - "https://aausmartlab.org/Shells/Assembly/FuseModule"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Assemble:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/AssemblyScrewing/AssembleCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Assemble"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "KUKAManipulator"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/AssemblyScrewing/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "KUKAManipulator"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -700.0, YPos: -700.0 }
      Point2: { XPos: 700.0, YPos: -700.0 }
      Point3: { XPos: 700.0, YPos: 700.0 }
      Point4: { XPos: -700.0, YPos: 700.0 }
    InOutputZones:
