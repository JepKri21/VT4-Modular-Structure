type: "assembly_module"
label: "Assembly Module – Screwing (AAU Lab)"
description: "KUKA manipulator torque-controlled screwing station for fastening Fuse Module and PCB sub-assemblies to Bottom Cover."

asset_name: "Assembly_Screwing"

submodels:
  AssembleCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/SubAssembly/BottomCoverPCB"
      - "https://aausmartlab.org/Shells/SubAssembly/BottomCoverPCBFuse"
      - "https://aausmartlab.org/Shells/SubAssembly/FuseModule"
      - "https://aausmartlab.org/Shells/Configuration/MobilePhone"
    Parameters:
      SupportedAssemblyTypes:
        - "screwing"
        - "torque-controlled"
      AssemblyPosition:
        XPos: { min: -60.0, max: 60.0 }
        YPos: { min: -60.0, max: 60.0 }
      MaxComponentCount:
        min: 2
        max: 6
      MaxAssemblyTime_s:
        min: 10.0
        max: 120.0

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/SubAssembly/BottomCoverPCB"
      - "https://aausmartlab.org/Shells/SubAssembly/FuseModule"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Skill:
      - SkillName: "Assemble"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Assembly_Screwing/AssembleCapabilityOffered"
        SkillTriggers:
          [
            "START",
            "STOP",
            "RESET",
            "ABORT",
            "CLEAR",
            "HOLD",
            "UNHOLD",
            "SUSPEND",
            "UNSUSPEND",
          ]
        Actors:
          - "KUKAManipulator"
      - SkillName: "Handoff"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Assembly_Screwing/HandoffCapabilityOffered"
        SkillTriggers:
          [
            "START",
            "STOP",
            "RESET",
            "ABORT",
            "CLEAR",
            "HOLD",
            "UNHOLD",
            "SUSPEND",
            "UNSUSPEND",
          ]
        Actors:
          - "KUKAManipulator"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -70.0, YPos: -70.0 }
      Point2: { XPos: 70.0, YPos: -70.0 }
      Point3: { XPos: 70.0, YPos: 70.0 }
      Point4: { XPos: -70.0, YPos: 70.0 }
    InOutputZones:
      - Point1: { XPos: -60.0, YPos: 70.0 }
        Point2: { XPos: 60.0, YPos: 70.0 }
        Point3: { XPos: 60.0, YPos: 160.0 }
        Point4: { XPos: -60.0, YPos: 160.0 }
