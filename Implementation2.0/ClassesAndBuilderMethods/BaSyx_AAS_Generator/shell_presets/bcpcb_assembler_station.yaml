type: "assembly_module"
label: "BCPCB Assembler Station – AAU Lab"
description: "KUKA Manipulator station for assembling Bottom Cover and PCB into BCPCB sub-assembly"

asset_name: "BCPCBAssembler"

submodels:
  AssembleCapabilityOffered:
    CapabilityCategory: "Offered"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/PCB"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        en: "Assembly operation"
        dk: "Samleroperation"
    ProcessTransformations:
      BottomCoverAndPCB:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/BottomCover"
            - "https://aausmartlab.org/Shells/Component/PCB"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/PCB"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        en: "Handoff operation"
        dk: "Afleveringsoperation"

  Skills:
    Assemble:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/BCPCBAssembler/AssembleCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Assemble"
      SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
      Actors:
        - "KUKAManipulator"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/BCPCBAssembler/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
      Actors:
        - "KUKAManipulator"

  Inventory:
    Inventories:
      - Specifications:
          InventorySize: 10
        SupportedComponents:
          - "https://aausmartlab.org/Shells/Component/PCB"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -50.0, YPos: -50.0 }
      Point2: { XPos:  50.0, YPos: -50.0 }
      Point3: { XPos:  50.0, YPos:  50.0 }
      Point4: { XPos: -50.0, YPos:  50.0 }
    InOutputZones:
      - Point1: { XPos: -40.0, YPos:  50.0 }
        Point2: { XPos:  40.0, YPos:  50.0 }
        Point3: { XPos:  40.0, YPos: 130.0 }
        Point4: { XPos: -40.0, YPos: 130.0 }
