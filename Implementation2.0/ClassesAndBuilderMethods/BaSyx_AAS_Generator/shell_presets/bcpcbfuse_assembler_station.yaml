type: "assembly_module"
label: "BCPCBFuse Assembler Station – AAU Lab"
description: "KUKA Manipulator station for assembling BottomCoverPCB and Fuse into BCPCBFuse sub-assembly"

asset_name: "BCPCBFuseAssembler"

submodels:
  AssembleCapabilityOffered:
    CapabilityCategory: "Offered"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
      - "https://aausmartlab.org/Shells/Component/Fuse"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        en: "Assembly operation"
        dk: "Samleroperation"
    ProcessTransformations:
      BottomCoverPCBAndFuse:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
            - "https://aausmartlab.org/Shells/Component/Fuse"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
      BottomCoverPCBFuseAndFuse:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
            - "https://aausmartlab.org/Shells/Component/Fuse"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"

  HandoffCapabilityOffered:
    CapabilityCategory: "Offered"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
      - "https://aausmartlab.org/Shells/Component/Fuse"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        en: "Handoff operation"
        dk: "Afleveringsoperation"
    ProcessTransformations:
      ReceiveBottomCoverPCB:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
        OutputTypes:
          ComponentTypeReference:
            - null
      ProvideBottomCoverPCBFuse:
        InputTypes:
          ComponentTypeReference:
            - null
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"

  Skills:
    BCPCBFuseAssembly:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/BCPCBFuseAssembler/AssembleCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Assemble"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "KUKAManipulator"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/BCPCBFuseAssembler/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
