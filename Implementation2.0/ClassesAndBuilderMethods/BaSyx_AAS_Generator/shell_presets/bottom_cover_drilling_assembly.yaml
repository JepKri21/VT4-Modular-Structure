# Preset for a sub-assembly where a bottom cover component is drilled.
# The BOM references the required product family and reserves a ComponentInstanceRef slot
# that is filled during production when a physical instance is assigned.
# The BOP contains a single Drilling step whose CapabilityParams are used to
# auto-generate a RequiredDrillingCapability submodel at creation time.
# An orchestrator must match this against an offered capability before dispatching.

shell: "sub_assembly_shell"
label: "Bottom Cover – Drilling Sub-Assembly"
description: "Sub-assembly in which a bottom cover component is drilled to specification. Requires a station that offers the matching drilling capability."

asset_name: "BottomCoverDrilling_SA"
asset_category: "Telefon"

submodels:
  Properties:
    PhysicalDimensions:
      Weight_g: 118.5   # equals the undrilled bottom cover — update if drilling removes significant mass

  Documentation:
    ProductionIdentification:
      ModelNumber: "SA-BCD-001"
      # SerialNumber: leave blank — unique per instance
      # BatchNumber: leave blank — set at production time
    HardwareRevision: "v1.0"
    DisplayName:
      - language: "en"
        text: "Bottom Cover Drilling Sub-Assembly"
      - language: "da"
        text: "Bundlåg Bore-Samleenhed"
    Description:
      - language: "en"
        text: "Sub-assembly: aluminium bottom cover drilled to mounting-hole pattern SA-BCD-001"
      - language: "da"
        text: "Samleenhed: aluminiums bundlåg boret til monteringshulsmønster SA-BCD-001"
    ProductFamily: "FuseBox Series A"
    HardwareRevision: "v1.0"

  BillOfMaterials:
    BOMEntries:
      - Description: "Bottom Cover – PLA"
        Quantity: 1
        ProductFamilyRef: "https://aausmartlab.org/Shells/Component/BottomCover"

  BillOfProcesses:
    ProcessSteps:
      - Operation: "Drilling"
        RequiredComponents:
          - "BottomCover"
        StepConstraints:
          MaxDuration_s: 180
          RequiresInspection: true
          RequiredComponentState: "Raw"
        CapabilityParams:
          DrillingParameters:
            BitDiameter_mm: 5.0
            DrillDepth_mm: 3.0
            SpindleSpeed_RPM: 1800.0
            SpindleFeed_mm_per_s: 2.5
            HolePlacement_x_mm: 75.0
            HolePlacement_y_mm: 40.0
            OperationLabel:
              - language: "en"
                text: "Drill mounting holes in aluminium bottom cover"
              - language: "da"
                text: "Bor monteringshuller i aluminiums bundlåg"
          SupportedComponents:
            - "BottomCover_ALU"
          AllowedMaterials:
            - "Aluminium"
