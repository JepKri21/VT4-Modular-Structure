type: "storage_module"
label: "Storage Module – Single Rack (AAU Lab)"
description: "UR5 compact single-rack storage module. One 15-slot inventory for raw Bottom Cover and Top Cover components."

asset_name: "Storage_SingleRack_01"

submodels:
  StoreCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
      - "https://aausmartlab.org/Shells/Component/Top_Cover"

  RetrieveCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
      - "https://aausmartlab.org/Shells/Component/Top_Cover"

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
      - "https://aausmartlab.org/Shells/Component/Top_Cover"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Inventory:
    Inventories:
      - Specifications:
          InventorySize: 15
        SupportedComponents:
          - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
          - "https://aausmartlab.org/Shells/Component/Top_Cover"

  Skills:
    Skill:
      - SkillName: "Store"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage_SingleRack_01/StoreCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "UR5"
      - SkillName: "Retrieve"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage_SingleRack_01/RetrieveCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "UR5"
      - SkillName: "Handoff"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Storage_SingleRack_01/HandoffCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "UR5"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -35.0, YPos: -35.0 }
      Point2: { XPos:  35.0, YPos: -35.0 }
      Point3: { XPos:  35.0, YPos:  35.0 }
      Point4: { XPos: -35.0, YPos:  35.0 }
    InOutputZones:
      - Point1: { XPos: -30.0, YPos:  35.0 }
        Point2: { XPos:  30.0, YPos:  35.0 }
        Point3: { XPos:  30.0, YPos: 100.0 }
        Point4: { XPos: -30.0, YPos: 100.0 }
