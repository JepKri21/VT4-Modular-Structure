type: "storage_module"
label: "Storage Module – Single Rack (AAU Lab)"
description: "UR5 compact single-rack storage module. One 15-slot inventory for raw Bottom Cover and Top Cover components."

asset_name: "StorageSingleRack"

submodels:
  StoreCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"

  RetrieveCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Inventory:
    Inventories:
      - Specifications:
          InventorySize: 15
        SupportedComponents:
          - "https://aausmartlab.org/Shells/Component/BottomCover"
          - "https://aausmartlab.org/Shells/Component/TopCover"

  Skills:
    Store:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/StorageSingleRack/StoreCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Store"
      SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
      Actors:
        - "UR5"
    Retrieve:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/StorageSingleRack/RetrieveCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Retrieve"
      SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
      Actors:
        - "UR5"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/StorageSingleRack/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
      Actors:
        - "UR5"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -60.0, YPos: -60.0 }
      Point2: { XPos:  60.0, YPos: -60.0 }
      Point3: { XPos:  60.0, YPos:  60.0 }
      Point4: { XPos: -60.0, YPos:  60.0 }
    InOutputZones:
      - Point1: { XPos: -50.0, YPos:  60.0 }
        Point2: { XPos:  50.0, YPos:  60.0 }
        Point3: { XPos:  50.0, YPos: 150.0 }
        Point4: { XPos: -50.0, YPos: 150.0 }
