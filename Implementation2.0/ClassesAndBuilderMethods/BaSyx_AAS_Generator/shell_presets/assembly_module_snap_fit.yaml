type: "assembly_module"
label: "Assembly Module – Snap-Fit (AAU Lab)"
description: "UR5 snap-fit assembly station for joining Bottom Cover and Bottom Cover PCB sub-assemblies without fasteners."

asset_name: "Assembly_SnapFit"

submodels:
  AssembleCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
    Parameters:
      SupportedAssemblyTypes:
        - "snap-fit"
        - "press-fit"
      AssemblyPosition:
        XPos: { min: -55.0, max: 55.0 }
        YPos: { min: -55.0, max: 55.0 }
      MaxComponentCount:
        min: 2
        max: 4
      MaxAssemblyTime_s:
        min: 5.0
        max: 60.0

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Skill:
      - SkillName: "Assemble"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Assembly_SnapFit/AssembleCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "UR5"
      - SkillName: "Handoff"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Assembly_SnapFit/HandoffCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "UR5"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -65.0, YPos: -65.0 }
      Point2: { XPos:  65.0, YPos: -65.0 }
      Point3: { XPos:  65.0, YPos:  65.0 }
      Point4: { XPos: -65.0, YPos:  65.0 }
    InOutputZones:
      - Point1: { XPos: -55.0, YPos:  65.0 }
        Point2: { XPos:  55.0, YPos:  65.0 }
        Point3: { XPos:  55.0, YPos: 155.0 }
        Point4: { XPos: -55.0, YPos: 155.0 }
