type: "assembly_module"
label: "Assembly Module – Snap-Fit (AAU Lab)"
description: "UR5 snap-fit assembly station for joining Bottom Cover and Bottom Cover PCB sub-assemblies without fasteners."

asset_name: "AssemblySnapFit"

submodels:
  AssembleCapabilityOffered:
    CapabilityCategory: "Offered"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        - language: "en"
          text: "Snap-fit assembly operation"
        - language: "da"
          text: "Snap-fit samling"
    ProcessTransformations:
      BottomCoverAndPCB:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/BottomCover"
            - "https://aausmartlab.org/Shells/Component/PCB"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"

  HandoffCapabilityOffered:
