    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/AssemblySnapFit/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
