    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        - language: "en"
          text: "Snap-fit assembly operation"
        - language: "da"
