type: "assembly_module"
label: "Assembly Module – Snap-Fit (AAU Lab)"
description: "UR5 snap-fit assembly station for joining Bottom Cover and Bottom Cover PCB sub-assemblies without fasteners."

asset_name: "AssemblySnapFit"

submodels:
