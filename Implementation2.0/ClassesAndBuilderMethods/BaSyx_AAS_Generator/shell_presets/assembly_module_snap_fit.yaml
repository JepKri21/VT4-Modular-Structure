        - { XPos: 650.0, YPos: 650.0 }
        - { XPos: -650.0, YPos: 650.0 }
    InOutputZones:
      - Points:
          - { XPos: -550.0, YPos: 650.0 }
          - { XPos: 550.0, YPos: 650.0 }
