      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Assemble:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/AssemblySnapFit/AssembleCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Assemble"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
