shell: "resource_shell"
label: "Drilling Station – AAU Lab"
description: "KUKA Manipulator drilling station with drilling and handoff capabilities"

asset_name: "Drilling"

submodels:
  DrillingCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityReference: "https://aausmartlab.org/Submodels/Capability/Drilling"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
      - "https://aausmartlab.org/Shells/Component/Top_Cover"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
    Parameters:
      HoleDiameter: 5.0
      DrillDepth:
        min: 0.0
        max: 200.0
      TargetPosition:
        XPos: { min: -60.0, max: 60.0 }
        YPos: { min: -60.0, max: 60.0 }

  HandoffCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
      - "https://aausmartlab.org/Shells/Component/Top_Cover"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Skill:
      - SkillName: "Drilling"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Drilling/DrillingCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "KUKAManipulator"
      - SkillName: "Handoff"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Drilling/HandoffCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "KUKAManipulator"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -60.0, YPos: -60.0 }
      Point2: { XPos:  60.0, YPos: -60.0 }
      Point3: { XPos:  60.0, YPos:  60.0 }
      Point4: { XPos: -60.0, YPos:  60.0 }
    InOutputZones:
      - Point1: { XPos: -50.0, YPos:  60.0 }
        Point2: { XPos:  50.0, YPos:  60.0 }
        Point3: { XPos:  50.0, YPos: 150.0 }
        Point4: { XPos: -50.0, YPos: 150.0 }

  Communication:
    MQTT:
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
