shell: "final_product_shell"
label: "Final Product – AAU Mobile Phone (Example)"
description: "Preset that models the AAU Mobile Phone: BOM entries and a simple BOP to mirror the dummy phone example."

asset_type: "MobilePhone"
asset_name: "AAUMobilePhoneV1"
asset_category: "Telefon"

submodels:
  Properties:
    PhysicalDimensions:
      Length: 140
      Width: 70
      Height: 12
      Weight: 180.0

  Documentation:
    ProductionIdentification:
      ModelNumber: "AAU-MP-001"
      HardwareRevision: "v1.0"
    DisplayName:
      - language: "en"
        text: "AAU Mobile Phone"
      - language: "da"
        text: "AAU Mobiltelefon"

  BillOfMaterials:
    BOMEntries:
      - Description: "Bottom Cover PCB Fuse Sub-Assembly"
        Quantity: 1
        IsSubAssembly: true
        ComponentTypeReference: "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
      - Description: "Top Cover"
        Quantity: 1
        IsSubAssembly: false
        ComponentTypeReference: "https://aausmartlab.org/Shells/Component/TopCover"

  BillOfProcesses:
    ProcessSteps:
      - Operation: "Assemble Top Cover"
        ProcessType: "Assemble"
        RequiredComponents:
          - "BottomCoverPCBFuse"
          - "TopCover"
        StepConstraints:
          MaxDurationS: 120
        CapabilityParams:
          Parameters:
            TargetPosition:
              XPos: 0.0
              YPos: 0.0
            OperationLabel:
              - language: "en"
                text: "Assemble top cover onto mobile phone assembly"
              - language: "da"
                text: "Monter toplåg på mobiltelefon samleenhed"
          ProcessTransformations:
            AssembleTopCover:
              InputTypes:
                ComponentTypeReference:
                  - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
                  - "https://aausmartlab.org/Shells/Component/TopCover"
              OutputTypes:
                ComponentTypeReference:
                  - "https://aausmartlab.org/Shells/Product/MobilePhone"
          SupportedComponents:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
            - "https://aausmartlab.org/Shells/Component/TopCover"
