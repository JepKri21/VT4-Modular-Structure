type: "storage_module"
label: "Storage Module – Multi-Rack (AAU Lab)"
description: "UR5 multi-rack storage module with two inventories: 10-slot rack for raw covers and 5-slot rack for drilled covers."

asset_name: "StorageMultiRack"

submodels:
  StoreCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Component/BottomCoverDrilled"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"

  RetrieveCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Component/BottomCoverDrilled"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Component/BottomCoverDrilled"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Inventory:
    Inventories:
      - Specifications:
          InventorySize: 10
        SupportedComponents:
          - "https://aausmartlab.org/Shells/Component/BottomCover"
          - "https://aausmartlab.org/Shells/Component/TopCover"
        Actors:
          - "UR5"
      - Specifications:
          InventorySize: 5
        SupportedComponents:
          - "https://aausmartlab.org/Shells/Product/MobilePhone"
        Actors:
          - "UR5"

  Skills:
    Store:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/StorageMultiRack/StoreCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Store"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "UR5"
    Retrieve:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/StorageMultiRack/RetrieveCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Retrieve"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "UR5"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/StorageMultiRack/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "UR5"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Points:
        - { XPos: -600.0, YPos: -600.0 }
        - { XPos: 600.0, YPos: -600.0 }
        - { XPos: 600.0, YPos: 600.0 }
        - { XPos: -600.0, YPos: 600.0 }
    InOutputZones:
      - Points:
          - { XPos: -500.0, YPos: 600.0 }
          - { XPos: 500.0, YPos: 600.0 }
          - { XPos: 500.0, YPos: 1500.0 }
          - { XPos: -500.0, YPos: 1500.0 }

  Communication:
    MQTT:
      ProductionLinePrefix: ""
      BrokerID: ""
      BrokerPort: ""
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
        InventoryLevelSuffix: "InventoryLevel"
