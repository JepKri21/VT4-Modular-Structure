# SA2 Sub-Assembly: Bottom Cover PCB Fuse Assembly
# Inputs: SA1 (Bottom Cover PCB) + 2 Fuses
# Output: Bottom Cover with PCB and fuses mounted
# Two separate BOM entries (one per fuse) so each physical fuse gets its own
# ComponentReference slot for full traceability.
# IsSubAssembly flags are MES-specific — ignored by form_to_aas.py template processing.

type: "bottom_cover_assembly_chain"
label: "Bottom Cover PCB Fuse Sub-Assembly"
description: "Sub-assembly in which two fuses are mounted onto the PCB inside the bottom cover."

asset_type: "BottomCoverPCBFuse"
asset_name: "BottomCoverPCBFuse"
asset_category: "Electrical"

submodels:
  Properties:
    PhysicalDimensions:
      Weight: 240.0

  Documentation:
    ProductionIdentification:
      ModelNumber: "SA-BCPF-001"
    DisplayName:
      - language: "en"
        text: "Bottom Cover PCB Fuse Sub-Assembly"
      - language: "da"
        text: "Bundlåg PCB Sikring Samleenhed"
    Description:
      - language: "en"
        text: "Sub-assembly: bottom cover PCB assembly with two fuses mounted on the PCB"
      - language: "da"
        text: "Samleenhed: bundlåg PCB samleenhed med to sikringer monteret på PCB"

  BillOfMaterials:
    BOMEntries:
      - Description: "Bottom Cover PCB Sub-Assembly"
        Quantity: 1
        IsSubAssembly: true
        ComponentTypeReference: "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
      - Description: "Fuse Slow Blow 1"
        Quantity: 1
        IsSubAssembly: false
        ComponentTypeReference: "https://aausmartlab.org/Shells/Component/Fuse"
      - Description: "Fuse Slow Blow 2"
        Quantity: 1
        IsSubAssembly: false
        MinOrderedQuantity: 2
        ComponentTypeReference: "https://aausmartlab.org/Shells/Component/Fuse"

  BillOfProcesses:
    ProcessTracking:
      - StepRef: "Assemble_First_Fuse_1"
        StepStatus: "Pending"
      - StepRef: "Assemble_Second_Fuse_2"
        StepStatus: "Pending"
        MinOrderedQuantity: 2

    ProcessSteps:
      - Operation: "Assemble First Fuse"
        ProcessType: "Assemble"
        RequiredComponents:
          - "BottomCoverPCB"
          - "Fuse"
        StepConstraints:
          MaxDurationS: 90
          RequiresInspection: false
        CapabilityParams:
          Parameters:
            TargetPosition:
              XPos: 5.0
              YPos: -10.0
            OperationLabel:
              - language: "en"
                text: "Assemble first fuse onto PCB"
              - language: "da"
                text: "Monter første sikring på PCB"
          ProcessTransformations:
            AssembleFirstFuse:
              InputTypes:
                ComponentTypeReference:
                  - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
                  - "https://aausmartlab.org/Shells/Component/Fuse"
              OutputTypes:
                ComponentTypeReference:
                  - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
          SupportedComponents:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
            - "https://aausmartlab.org/Shells/Component/Fuse"

      - Operation: "Assemble Second Fuse"
        ProcessType: "Assemble"
        MinOrderedQuantity: 2
        RequiredComponents:
          - "Fuse"
        StepConstraints:
          MaxDurationS: 90
          RequiresInspection: false
        CapabilityParams:
          Parameters:
            TargetPosition:
              XPos: 5.0
              YPos: -20.0
            OperationLabel:
              - language: "en"
                text: "Assemble second fuse onto PCB"
              - language: "da"
                text: "Monter anden sikring på PCB"
          ProcessTransformations:
            AssembleSecondFuse:
              InputTypes:
                ComponentTypeReference:
                  - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
                  - "https://aausmartlab.org/Shells/Component/Fuse"
              OutputTypes:
                ComponentTypeReference:
                  - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
          SupportedComponents:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
            - "https://aausmartlab.org/Shells/Component/Fuse"
