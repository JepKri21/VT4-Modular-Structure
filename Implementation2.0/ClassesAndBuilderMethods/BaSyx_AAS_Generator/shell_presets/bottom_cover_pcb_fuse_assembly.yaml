# SA2 Sub-Assembly: Bottom Cover PCB Fuse Assembly
# Inputs: SA1 (Bottom Cover PCB) + Fuse 1 + Fuse 2
# Output: Bottom Cover with PCB and two fuses mounted
# Two separate Assemble steps: first fuse mounts onto BottomCoverPCB,
# second fuse mounts onto the partially assembled result.
# IsSubAssembly flags are MES-specific — ignored by form_to_aas.py template processing.

type: "bottom_cover_assembly_chain"
label: "Bottom Cover PCB Fuse Sub-Assembly"
description: "Sub-assembly in which two fuses are mounted onto the PCB inside the bottom cover."

asset_type: "BottomCoverPCBFuse"
asset_name: "BottomCoverPCBFuse"
asset_category: "Electrical"

submodels:
  Properties:
    PhysicalDimensions:
      Weight: 240.0

  Documentation:
    ProductionIdentification:
      ModelNumber: "SA-BCPF-001"
    DisplayName:
      - language: "en"
        text: "Bottom Cover PCB Fuse Sub-Assembly"
      - language: "da"
        text: "Bundlåg PCB Sikring Samleenhed"
    Description:
      - language: "en"
        text: "Sub-assembly: bottom cover PCB assembly with two fuses mounted on the PCB"
      - language: "da"
        text: "Samleenhed: bundlåg PCB samleenhed med to sikringer monteret på PCB"

  BillOfMaterials:
    BOMEntries:
      - Description: "Bottom Cover PCB Sub-Assembly"
        Quantity: 1
        IsSubAssembly: true
        ProductFamilyRef: "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB/BottomCoverPCB"
      - Description: "Fuse 1 – 16A Slow-Blow"
        Quantity: 1
        IsSubAssembly: false
        ProductFamilyRef: "https://aausmartlab.org/Shells/Component/Fuse/Fuse16ASB"
      - Description: "Fuse 2 – 16A Slow-Blow"
        Quantity: 1
        IsSubAssembly: false
        ProductFamilyRef: "https://aausmartlab.org/Shells/Component/Fuse/Fuse16ASB"

  BillOfProcesses:
    ProcessTracking:
      - StepRef: "Assemble_Fuse1_1"
        StepStatus: "Pending"
      - StepRef: "Assemble_Fuse2_2"
        StepStatus: "Pending"

    ProcessSteps:
      - Operation: "Assemble Fuse 1"
        ProcessType: "Assemble"
        RequiredComponents:
          - "BottomCoverPCB"
          - "Fuse16ASB"
        StepConstraints:
          MaxDurationS: 90
          RequiresInspection: false

      - Operation: "Assemble Fuse 2"
        ProcessType: "Assemble"
        RequiredComponents:
          - "Fuse16ASB"
        StepConstraints:
          MaxDurationS: 90
          RequiresInspection: false
