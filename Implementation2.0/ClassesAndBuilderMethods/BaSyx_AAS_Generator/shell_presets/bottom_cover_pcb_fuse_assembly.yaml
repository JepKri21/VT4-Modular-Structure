# SA2 Sub-Assembly: Bottom Cover PCB Fuse Assembly
# Inputs: SA1 (Bottom Cover PCB) + N Fuses
# Output: Bottom Cover with PCB and N fuses mounted
#
# The number of fuses is DYNAMIC — driven by the fuse quantity selected in the
# webstore (fuseCount: 1/2/3/…). The single Fuse BOM entry and single
# "Assemble Fuse" process step below are marked `PerFuseUnit: true` and expanded
# at order time by preset_loader.expand_fuse_assembly() into one concrete BOM
# entry + one assemble step per physical fuse — each with its own
# ComponentReference slot (for traceability) and its own TargetPosition
# (XPos constant, YPos = -10 × fuseIndex).
#
# IsSubAssembly flags are MES-specific — ignored by form_to_aas.py template processing.

type: "bottom_cover_assembly_chain"
label: "Bottom Cover PCB Fuse Sub-Assembly"
description: "Sub-assembly in which one or more fuses are mounted onto the PCB inside the bottom cover."

asset_type: "BottomCoverPCBFuse"
asset_name: "BottomCoverPCBFuse"
asset_category: "Electrical"

submodels:
  Properties:
    PhysicalDimensions:
      Weight: 240.0

  Documentation:
    ProductionIdentification:
      ModelNumber: "SA-BCPF-001"
    DisplayName:
      - language: "en"
        text: "Bottom Cover PCB Fuse Sub-Assembly"
      - language: "da"
        text: "Bundlåg PCB Sikring Samleenhed"
    Description:
      - language: "en"
        text: "Sub-assembly: bottom cover PCB assembly with one or more fuses mounted on the PCB"
      - language: "da"
        text: "Samleenhed: bundlåg PCB samleenhed med en eller flere sikringer monteret på PCB"

  BillOfMaterials:
    BOMEntries:
      - Description: "Bottom Cover PCB Sub-Assembly"
        Quantity: 1
        IsSubAssembly: true
        ComponentTypeReference: "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
      # Per-fuse template — expanded to `fuseCount` entries at order time.
      # Each physical fuse gets its own entry (Quantity 1) for full traceability.
      # MinQuantity/MaxQuantity are the single source of truth for how many fuses
      # a phone may have. They bound the webstore selection (UI + order API) and
      # clamp the MES expander. To change the allowed fuse range, edit them here.
      - Description: "Fuse Slow Blow"
        Quantity: 1
        IsSubAssembly: false
        PerFuseUnit: true
        MinQuantity: 1
        MaxQuantity: 3
        ComponentTypeReference: "https://aausmartlab.org/Shells/Component/Fuse"

  BillOfProcesses:
    ProcessTracking:
      - StepRef: "Assemble_Fuse_1"
        StepStatus: "Pending"

    ProcessSteps:
      # Per-fuse template — expanded to one "Assemble Fuse {i}" step per physical
      # fuse at order time. The first fuse step also consumes the BottomCoverPCB
      # sub-assembly; subsequent steps build on the partial BottomCoverPCBFuse.
      # The expander rewrites Operation, RequiredComponents, TargetPosition,
      # OperationLabel and ProcessTransformations per fuse index.
      - Operation: "Assemble Fuse"
        ProcessType: "Assemble"
        PerFuseUnit: true
        RequiredComponents:
          - "BottomCoverPCB"
          - "Fuse"
        StepConstraints:
          MaxDurationS: 90
          RequiresInspection: false
        CapabilityParams:
          Parameters:
            TargetPosition:
              XPos: 5.0
              YPos: -10.0
            OperationLabel:
              - language: "en"
                text: "Assemble fuse onto PCB"
              - language: "da"
                text: "Monter sikring på PCB"
          ProcessTransformations:
            AssembleFuse:
              InputTypes:
                ComponentTypeReference:
                  - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
                  - "https://aausmartlab.org/Shells/Component/Fuse"
              OutputTypes:
                ComponentTypeReference:
                  - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
          SupportedComponents:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCB"
            - "https://aausmartlab.org/Shells/Component/Fuse"
