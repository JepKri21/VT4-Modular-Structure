shell: "final_product_shell"
label: "Final Product – AAU Mobile Phone (Example)"
description: "Preset that models the AAU Mobile Phone: BOM entries and a simple BOP to mirror the dummy phone example."

asset_type: "Mobile_Phone"
asset_name: "AAU_Mobile_Phone_v1"
asset_category: "Electrical"

submodels:
  Properties:
    PhysicalDimensions:
      Length: 140
      Width: 70
      Height: 12
      Weight_g: 180.0
    MaterialProperties:
      Material: "ABS"
      Color: "Black"

  Documentation:
    ProductionIdentification:
      ModelNumber: "AAU-MP-001"
      HardwareRevision: "v1.0"
    DisplayName:
      - language: "en"
        text: "AAU Mobile Phone"
      - language: "da"
        text: "AAU Mobiltelefon"

  BillOfMaterials:
    BOMEntries:
      - Description: "Bottom cover (housing)"
        Quantity: 1
        Required: true
        IsSubAssembly: false
        ProductFamilyRef: "https://aausmartlab.org/Shells/Component/Bottom_Cover/BottomCover_3DP"
      - Description: "Top cover"
        Quantity: 1
        Required: true
        IsSubAssembly: false
        ProductFamilyRef: "https://aausmartlab.org/Shells/Component/Top_Cover/TopCover"
      - Description: "PCB assembly – main"
        Quantity: 1
        Required: true
        IsSubAssembly: true
        ProductFamilyRef: "https://aausmartlab.org/Shells/Component/PCB/PCB_FuseBoxA"
      - Description: "Fuse 1 – 16A Slow-Blow"
        Quantity: 1
        Required: false
        IsSubAssembly: false
        ProductFamilyRef: "https://aausmartlab.org/Shells/Component/Fuse/Fuse_16A_SB"
      - Description: "Fuse 2 – 16A Slow-Blow"
        Quantity: 1
        Required: false
        IsSubAssembly: false
        ProductFamilyRef: "https://aausmartlab.org/Shells/Component/Fuse/Fuse_16A_SB"

  BillOfProcesses:
    ProcessSteps:
      - Operation: "Drill holes (if required)"
        ProcessType: "Drilling"
        RequiredComponents:
          - "BottomCover_3DP"
        StepConstraints:
          MaxDuration_s: 120
      
      - Operation: "Assemble"
        ProcessType: "Assemble"
        RequiredComponents:
          - "PCB_FuseBoxA"
        StepConstraints:
          MaxDuration_s: 180
      - Operation: "Assemble fuses"
        ProcessType: "Assemble"
        RequiredComponents:
          - "Fuse_16A_SB"
        StepConstraints:
          MaxDuration_s: 90
      - Operation: "Assemble top cover"
        ProcessType: "Assemble"
        RequiredComponents:
          - "TopCover"
        StepConstraints:
          MaxDuration_s: 120
      
