type: "drilling_station"
label: "Drilling Station – UR5 Precision (AAU Lab)"
description: "UR5 collaborative robot drilling station for precision small-diameter holes in Bottom Cover only. Narrower work envelope than the KUKA variant."

asset_name: "DrillingUR5"

submodels:
  DrillingCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
    Parameters:
      HoleDiameter: 3.0
      DrillDepth:
        min: 0.0
        max: 50.0
      TargetPosition:
        XPos: { min: -60.0, max: 60.0 }
        YPos: { min: -60.0, max: 60.0 }
    ProcessTransformations:
      BottomCoverDrilling:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/BottomCover"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/BottomCover"

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Drilling:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/DrillingUR5/DrillingCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Drilling"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "UR5"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/DrillingUR5/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "UR5"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Points:
        - { XPos: -600.0, YPos: -600.0 }
        - { XPos: 600.0, YPos: -600.0 }
        - { XPos: 600.0, YPos: 600.0 }
        - { XPos: -600.0, YPos: 600.0 }
    InOutputZones:
      - Points:
          - { XPos: -500.0, YPos: 600.0 }
          - { XPos: 500.0, YPos: 600.0 }
          - { XPos: 500.0, YPos: 1500.0 }
          - { XPos: -500.0, YPos: 1500.0 }

  Communication:
    MQTT:
      ProductionLinePrefix: ""
      BrokerID: ""
      BrokerPort: ""
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
