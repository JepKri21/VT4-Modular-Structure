type: "assembly_module"
label: "Phone Assembler Station – AAU Lab"
description: "KUKA Manipulator station for assembling BCPCBFuse sub-assembly and TopCover into the final MobilePhone product"

asset_name: "PhoneAssembler"

submodels:
  AssembleCapabilityOffered:
    CapabilityCategory: "Offered"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        en: "Assembly operation"
        dk: "Samleroperation"
    ProcessTransformations:
      BottomCoverPCBFuseAndTopCover:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
            - "https://aausmartlab.org/Shells/Component/TopCover"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Product/MobilePhone"

  HandoffCapabilityOffered:
    CapabilityCategory: "Offered"
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
      - "https://aausmartlab.org/Shells/Component/TopCover"
      - "https://aausmartlab.org/Shells/Product/MobilePhone"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""
      OperationLabel:
        en: "Handoff operation"
        dk: "Afleveringsoperation"
    ProcessTransformations:
      ReceiveBottomCoverPCBFuse:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Assembly/BottomCoverPCBFuse"
        OutputTypes:
          ComponentTypeReference:
            - null
      ReceiveTopCover:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/TopCover"
        OutputTypes:
          ComponentTypeReference:
            - null
      ProvideMobilePhone:
        InputTypes:
          ComponentTypeReference:
            - null
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Product/MobilePhone"

  Skills:
    PhoneAssembly:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/PhoneAssembler/AssembleCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Assemble"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "KUKAManipulator"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/PhoneAssembler/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "KUKAManipulator"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -150.0, YPos: -300.0 }
      Point2: { XPos: 150.0, YPos: -300.0 }
      Point3: { XPos: 300.0, YPos: -150.0 }
      Point4: { XPos: 300.0, YPos: 150.0 }
      Point5: { XPos: 150.0, YPos: 300.0 }
      Point6: { XPos: -150.0, YPos: 300.0 }
      Point7: { XPos: -300.0, YPos: 150.0 }
      Point8: { XPos: -300.0, YPos: -150.0 }
    InOutputZones:
      - Point1: { XPos: 350.0, YPos: 350.0 }
        Point2: { XPos: 350.0, YPos: 350.0 }
        Point3: { XPos: 350.0, YPos: 550.0 }
        Point4: { XPos: -350.0, YPos: 550.0 }

  Communication:
    MQTT:
      ProductionLinePrefix: ""
      BrokerID: ""
      BrokerPort: ""
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
