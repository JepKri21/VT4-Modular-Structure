type: "drilling_station"
label: "Drilling Station – KUKA Manipulator (AAU Lab)"
description: "KUKA manipulator drilling station. Supports PLA and ABS bottom and top covers. Based on the Drilling_12345678 instance in ProductAndResourceImplementations."

asset_name: "Drilling_KUKA_01"

submodels:
  DrillingCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
      - "https://aausmartlab.org/Shells/Component/Top_Cover"
    Parameters:
      HoleDiameter: 5.0
      DrillDepth:
        min: 0.0
        max: 200.0
      TargetPosition:
        XPos: { min: -50.0, max: 50.0 }
        YPos: { min: -50.0, max: 50.0 }

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/Bottom_Cover"
      - "https://aausmartlab.org/Shells/Component/Top_Cover"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Skill:
      - SkillName: "Drilling"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Drilling_KUKA_01/DrillingCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "KUKAManipulator"
      - SkillName: "Handoff"
        CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/Drilling_KUKA_01/HandoffCapabilityOffered"
        SkillTriggers: ["START", "STOP", "RESET", "ABORT", "CLEAR", "HOLD", "UNHOLD", "SUSPEND", "UNSUSPEND"]
        Actors:
          - "KUKAManipulator"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -50.0, YPos: -50.0 }
      Point2: { XPos:  50.0, YPos: -50.0 }
      Point3: { XPos:  50.0, YPos:  50.0 }
      Point4: { XPos: -50.0, YPos:  50.0 }
    InOutputZones:
      Zone1:
        Point1: { XPos: -40.0, YPos:  50.0 }
        Point2: { XPos:  40.0, YPos:  50.0 }
        Point3: { XPos:  40.0, YPos: 130.0 }
        Point4: { XPos: -40.0, YPos: 130.0 }
