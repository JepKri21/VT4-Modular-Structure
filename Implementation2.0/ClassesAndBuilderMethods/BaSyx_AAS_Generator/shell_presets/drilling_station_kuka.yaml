type: "drilling_station"
label: "Drilling Station – KUKA Manipulator (AAU Lab)"
description: "KUKA manipulator drilling station. Supports PLA and ABS bottom and top covers."

asset_name: "DrillingKUKA"

submodels:
  DrillingCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
    Parameters:
      HoleDiameter: 5.0
      DrillDepth:
        min: 0.0
        max: 200.0
      TargetPosition:
        XPos: { min: -60.0, max: 60.0 }
        YPos: { min: -60.0, max: 60.0 }
    ProcessTransformations:
      BottomCoverDrilling:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/BottomCover"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/BottomCover"
      TopCoverDrilling:
        InputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/TopCover"
        OutputTypes:
          ComponentTypeReference:
            - "https://aausmartlab.org/Shells/Component/TopCover"

  HandoffCapabilityOffered:
    SupportedComponents:
      - "https://aausmartlab.org/Shells/Component/BottomCover"
      - "https://aausmartlab.org/Shells/Component/TopCover"
    Parameters:
      TargetPosition:
        XPos: ""
        YPos: ""

  Skills:
    Drilling:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/DrillingKUKA/DrillingCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Drilling"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "KUKAManipulator"
    Handoff:
      CapabilitySubmodelReference: "https://aausmartlab.org/Shells/Resources/DrillingKUKA/HandoffCapabilityOffered"
      CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
      SkillTriggers:
        [
          "START",
          "STOP",
          "RESET",
          "ABORT",
          "CLEAR",
          "HOLD",
          "UNHOLD",
          "SUSPEND",
          "UNSUSPEND",
        ]
      Actors:
        - "KUKAManipulator"

  ResourceZones:
    CenterPoint:
      XPos: 0.0
      YPos: 0.0
    ResourceGeometry:
      Point1: { XPos: -600.0, YPos: -600.0 }
      Point2: { XPos: 600.0, YPos: -600.0 }
      Point3: { XPos: 600.0, YPos: 600.0 }
      Point4: { XPos: -600.0, YPos: 600.0 }
    InOutputZones:
      - Point1: { XPos: -500.0, YPos: 600.0 }
        Point2: { XPos: 500.0, YPos: 600.0 }
        Point3: { XPos: 500.0, YPos: 1500.0 }
        Point4: { XPos: -500.0, YPos: 1500.0 }

  Communication:
    MQTT:
      ProductionLinePrefix: ""
      BrokerID: ""
      BrokerPort: ""
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
