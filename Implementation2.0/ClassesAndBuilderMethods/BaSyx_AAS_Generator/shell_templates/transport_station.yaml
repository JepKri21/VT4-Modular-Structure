# Category type shell for Transport Station resources.
#
# Shared across all transport station presets:
#   - CapabilityCategory / CapabilityReference for Transport
#   - AllowedMaterials (PLA, ABS, PETG)
#   - Standard PackML Communication suffixes
#
# Preset (type: "transport_station") must supply:
#   SupportedComponents, TargetPosition range, Actors, ResourceZones

kind: "Type"
shell: "resource_shell"
asset_type: "TransportStation"
asset_category: "Resource"
id: "https://aausmartlab.org/Shells/Resources/TransportStation"

submodel_templates:
  TransportCapabilityOffered: "https://aausmartlab.org/Submodels/Templates/TransportCapabilityOffered"
  Skills: "https://aausmartlab.org/Submodels/Templates/Skills"
  ResourceZones: "https://aausmartlab.org/Submodels/Templates/ResourceZones"
  Communication: "https://aausmartlab.org/Submodels/Templates/Communication"

include:
  TransportCapabilityOffered:
    - Parameters
    - ProcessTransformations
    - SupportedComponents
    - AllowedMaterials
  Skills: []
  ResourceZones:
    - CenterPoint
    - ResourceGeometry
    - InOutputZones

submodels:
  TransportCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Transport"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
      - "https://aausmartlab.org/Materials/PETG"

  Communication:
    MQTT:
      ProductionLinePrefix: ""
      BrokerID: ""
      BrokerPort: ""
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
