# Category type shell for Drilling Station resources.
#
# Shared across all drilling station presets:
#   - CapabilityCategory / CapabilityTypeReference for Drilling and Handoff
#   - AllowedMaterials (PLA, ABS, PETG)
#   - Standard PackML Communication suffixes
#
# Preset (type: "drilling_station") must supply:
#   SupportedComponents, Parameters ranges, Actors, ResourceZones, Skills

kind: "Type"
shell: "resource_shell"
asset_type: "DrillingStation"
asset_category: "Resource"
id: "https://aausmartlab.org/Shells/Resources/DrillingStation"

submodel_templates:
  DrillingCapabilityOffered: "https://aausmartlab.org/Submodels/Templates/DrillingCapabilityOffered"
  HandoffCapabilityOffered: "https://aausmartlab.org/Submodels/Templates/HandoffCapabilityOffered"
  Skills: "https://aausmartlab.org/Submodels/Templates/Skills"
  ResourceZones: "https://aausmartlab.org/Submodels/Templates/ResourceZones"
  Communication: "https://aausmartlab.org/Submodels/Templates/Communication"

include:
  DrillingCapabilityOffered:
    - Parameters
    - ProcessTransformations
    - SupportedComponents
    - AllowedMaterials
  Skills: []
  ResourceZones:
    - CenterPoint
    - ResourceGeometry
    - InOutputZones

submodels:
  DrillingCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Drilling"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
      - "https://aausmartlab.org/Materials/PETG"

  HandoffCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
      - "https://aausmartlab.org/Materials/PETG"

  Communication:
    MQTT:
      ProductionLinePrefix: ""
      BrokerID: ""
      BrokerPort: ""
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
