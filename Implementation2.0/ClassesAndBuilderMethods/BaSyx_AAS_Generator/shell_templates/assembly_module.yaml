# Category type shell for Assembly Module resources.
#
# Shared across all assembly module presets:
#   - CapabilityCategory / CapabilityReference for Assemble and Handoff
#   - AllowedMaterials (PLA, ABS, Aluminum)
#   - Standard PackML Communication suffixes
#
# Preset (type: "assembly_module") must supply:
#   SupportedAssemblyTypes, AssemblyPosition ranges, MaxComponentCount, MaxAssemblyTimeS,
#   SupportedComponents, Actors, ResourceZones, Skills

kind: "Type"
shell: "resource_shell"
asset_type: "AssemblyModule"
asset_category: "Resource"
id: "https://aausmartlab.org/Shells/Resources/AssemblyModule"

submodel_templates:
  AssembleCapabilityOffered: "https://aausmartlab.org/Submodels/Templates/AssembleCapabilityOffered"
  HandoffCapabilityOffered:  "https://aausmartlab.org/Submodels/Templates/HandoffCapabilityOffered"
  Skills:                    "https://aausmartlab.org/Submodels/Templates/Skills"
  ResourceZones:             "https://aausmartlab.org/Submodels/Templates/ResourceZones"
  Inventory:                 "https://aausmartlab.org/Submodels/Templates/Inventory"
  Communication:             "https://aausmartlab.org/Submodels/Templates/Communication"

include:
  AssembleCapabilityOffered:
    - Parameters
    - ProcessTransformations
    - SupportedComponents
    - AllowedMaterials
  HandoffCapabilityOffered:
    - Parameters
    - SupportedComponents
    - AllowedMaterials
  Skills: []
  Inventory:
    - Inventories
  ResourceZones:
    - CenterPoint
    - ResourceGeometry
    - InOutputZones

submodels:
  AssembleCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Assemble"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
      - "https://aausmartlab.org/Materials/Aluminum"

  HandoffCapabilityOffered:
    CapabilityCategory: "Offered"
    CapabilityTypeReference: "https://aausmartlab.org/Submodels/Capability/Handoff"
    AllowedMaterials:
      - "https://aausmartlab.org/Materials/PLA"
      - "https://aausmartlab.org/Materials/ABS"
      - "https://aausmartlab.org/Materials/Aluminum"

  Communication:
    MQTT:
      ProductionLinePrefix: ""
      BrokerID: ""
      BrokerPort: ""
      Suffixes:
        CommandSuffix: "CMD"
        StateSuffix: "PackMLState"
        JobResultSuffix: "JobResult"
        InfoRequestSuffix: "InfoRequest"
        ResourceAcknowledgementSuffix: "ResourceAck"
        ControllerAcknowledgementSuffix: "ControllerAck"
        OccupancySuffix: "Occupy"
