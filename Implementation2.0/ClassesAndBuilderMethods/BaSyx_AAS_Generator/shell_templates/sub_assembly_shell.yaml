# AAS Shell template for Sub-Assembly type assets.
#
# Declares the asset metadata pattern and the required/optional submodels
# that every Sub-Assembly AAS shell must reference.  Concrete shells are
# generated by substituting {asset_type}, {asset_name}, and {category} at creation time.
#
# asset_kind:
#   "Type"     — a type-level shell (template, no physical instance yet)
#   "Instance" — a specific physical asset
#
# submodels[].required:
#   true  — shell MUST reference this submodel
#   false — shell MAY reference this submodel (optional capability)

kind: "Type"
description: "AAS shell template for Sub-Assembly type assets"

id_pattern: "https://aausmartlab.org/Shells/Assembly/{asset_type}/{asset_name}_{uuid}"
id_short_pattern: "{asset_name}"
global_asset_id_pattern: "https://aausmartlab.org/Shells/Assembly/{asset_type}/{asset_name}_{uuid}"

submodels:
  - template_id: "https://aausmartlab.org/Submodels/Templates/ProductProperties"
    id_short: "Properties"
    description: "Physical and material properties"
    required: true

  - template_id: "https://aausmartlab.org/Submodels/Templates/ProductDocumentation"
    id_short: "Documentation"
    description: "Human-readable reference information (display name, product family)"
    required: true

  - template_id: "https://aausmartlab.org/Submodels/Templates/BillOfMaterials"
    id_short: "BillOfMaterials"
    description: "Bill of Materials — components and quantities required"
    required: true

  - template_id: "https://aausmartlab.org/Submodels/Templates/BillOfProcesses"
    id_short: "BillOfProcesses"
    description: "Bill of Processes — ordered assembly steps and required capabilities"
    required: true

  - template_id: "https://aausmartlab.org/Submodels/Templates/ProcessTracking"
    id_short: "ProcessTracking"
    description: "Process history — all process steps applied to this sub-assembly instance"
    required: false

