id_short: "Documentation"
id: "https://aausmartlab.com/SubmodelTemplate/Component/Documentation/1/0"
description: "Documentation submodel template for manufactured components — human-readable reference information"

elements:
  - type: multi_language_property
    id_short: "DisplayName"
    semantic_id: "https://aausmartlab.com/Semantics/DisplayName"
    description: "Human-readable component name in one or more languages"
    cardinality: "One"

  - type: multi_language_property
    id_short: "Description"
    semantic_id: "https://aausmartlab.com/Semantics/Description"
    description: "Free-text description of the component and its purpose"
    cardinality: "One"

  - type: property
    id_short: "ManufacturerName"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.com/Semantics/ManufacturerName"
    description: "Name of the component manufacturer"
    cardinality: "One"

  - type: property
    id_short: "ProductFamily"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.com/Semantics/ProductFamily"
    description: "Product family this component belongs to"
    cardinality: "ZeroToOne"

  - type: property
    id_short: "HardwareRevision"
    value_type: "xs:string"
    semantic_id: "https://aausmartlab.com/Semantics/HardwareRevision"
    description: "Design revision of this component"
    cardinality: "ZeroToOne"

  - type: reference_element
    id_short: "DatasheetRef"
    semantic_id: "https://aausmartlab.com/Semantics/DatasheetRef"
    description: "Reference to the component datasheet or technical drawing"
    cardinality: "ZeroToOne"

  - type: reference_element
    id_short: "CertificationRef"
    semantic_id: "https://aausmartlab.com/Semantics/CertificationRef"
    description: "Reference to compliance or certification documentation (e.g. CE, RoHS)"
    cardinality: "ZeroToOne"
