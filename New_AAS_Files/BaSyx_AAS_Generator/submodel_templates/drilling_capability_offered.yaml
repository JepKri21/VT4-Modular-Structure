id_short: "DrillingCapabilityOffered"
id: "https://aausmartlab.org/SubmodelTemplate/Capability/BasicDrillingCapability/Offered/1/0"
description: "Offered capability template for a drilling resource — parameters expressed as ranges defining the operational envelope"

elements:
  - type: collection
    id_short: "DrillingParameters"
    semantic_id: "https://aausmartlab.org/Semantics/DrillingParameters"
    description: "Drilling parameters defining the capability envelope"
    cardinality: "One"
    elements:
      - type: property
        id_short: "BitDiameter_mm"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/BitDiameter_mm"
        description: "Drill bit diameter in mm"
        cardinality: "One"
        qualifiers:
          - type: "range_min"
            value_type: "xs:float"
            value: 1.0
            kind: "TEMPLATE_QUALIFIER"
          - type: "range_max"
            value_type: "xs:float"
            value: 20.0
            kind: "TEMPLATE_QUALIFIER"

      - type: range
        id_short: "DrillDepth_mm"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/DrillDepth_mm"
        description: "Minimum and maximum drill depth in mm"
        cardinality: "One"

      - type: range
        id_short: "SpindleSpeed_RPM"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/SpindleSpeed_RPM"
        description: "Spindle speed range in RPM"
        cardinality: "One"

      - type: range
        id_short: "SpindleFeed_mm_per_s"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/SpindleFeed_mm_per_s"
        description: "Spindle feed rate range in mm/s"
        cardinality: "One"

      - type: range
        id_short: "HolePlacement_x_mm"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/HolePlacement_x_mm"
        description: "Possible range of X-coordinate position of hole relative to product placement point"
        cardinality: "ZeroToOne"

      - type: range
        id_short: "HolePlacement_y_mm"
        value_type: "xs:float"
        semantic_id: "https://aausmartlab.org/Semantics/HolePlacement_y_mm"
        description: "Possible range of Y-coordinate position of hole relative to product placement point"
        cardinality: "ZeroToOne"

      - type: multi_language_property
        id_short: "OperationLabel"
        semantic_id: "https://aausmartlab.org/Semantics/OperationLabel"
        description: "Human-readable operation label in multiple languages"
        cardinality: "ZeroToOne"

  - type: list
    id_short: "SupportedComponents"
    semantic_id: "https://aausmartlab.org/Semantics/SupportedComponents"
    description: "Components this drilling station can process"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"

  - type: list
    id_short: "AllowedMaterials"
    semantic_id: "https://aausmartlab.org/Semantics/AllowedMaterials"
    description: "Materials that can be drilled by this capability"
    element_type: "property"
    value_type: "xs:string"
    cardinality: "ZeroToMany"

  - type: reference_element
    id_short: "ResourceReference"
    semantic_id: "https://aausmartlab.org/Semantics/ResourceReference"
    description: "Reference to the physical resource realizing this capability"
    cardinality: "ZeroToOne"
