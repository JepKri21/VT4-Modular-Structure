id_short: "assemble_capability"
id: "https://aausmartlab.org/SubmodelTemplate/Capability/assemble/1/0"
description: "Capability template for an assembly operation defining the parameters and constraints of the assembly process"

elements:
  - type: collection
    id_short: "NeededComponents"
    semantic_id: "https://aausmartlab.org/Semantics/NeededComponents"
    description: "Components needed for the assembly operation"
    cardinality: "One"
    extensible: true
    entry_template: "Component{N}Parameters"
    elements:
      - type: collection
        id_short: "Component1Parameters"
        semantic_id: "https://aausmartlab.org/Semantics/Component1Parameters"
        description: "Parameters for Component 1"
        cardinality: "One"
        elements:
          - type: property
            id_short: "Component1Type"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/Component1Type"
            description: "Type of the first component"
            cardinality: "One"
          - type: property
            id_short: "Component1Quantity"
            value_type: "xs:integer"
            semantic_id: "https://aausmartlab.org/Semantics/Component1Quantity"
            description: "Quantity of the first component needed for assembly"
            cardinality: "One"
      - type: collection
        id_short: "Component2Parameters"
        semantic_id: "https://aausmartlab.org/Semantics/Component2Parameters"
        description: "Parameters for Component 2"
        cardinality: "One"
        elements:
          - type: property
            id_short: "Component2Type"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/Component2Type"
            description: "Type of the second component"
            cardinality: "One"
          - type: property
            id_short: "Component2Quantity"
            value_type: "xs:integer"
            semantic_id: "https://aausmartlab.org/Semantics/Component2Quantity"
            description: "Quantity of the second component needed for assembly"
            cardinality: "One"         

  - type: collection
    id_short: "AssemblyConstraints"
    semantic_id: "https://aausmartlab.org/Semantics/AssemblyConstraints"
    description: "Constraints for the assembly operation such as time, tools, or environmental conditions"
    cardinality: "ZeroToOne"
    elements:
      - type: property
        id_short: "MaxAssemblyTime"
        value_type: "xs:duration"
        semantic_id: "https://aausmartlab.org/Semantics/MaxAssemblyTime"
        description: "Maximum time allowed for the assembly process"
        cardinality: "ZeroToOne"
      - type: property
        id_short: "RequiredTools"
        value_type: "xs:string"
        semantic_id: "https://aausmartlab.org/Semantics/RequiredTools"
        description: "Tools required for the assembly process"
        cardinality: "One"
      - type: collection
        id_short: "EnvironmentalConditions"
        semantic_id: "https://aausmartlab.org/Semantics/EnvironmentalConditions"
        description: "Environmental conditions required for the assembly process"
        cardinality: "ZeroToOne"
        elements:
          - type: property
            id_short: "TemperatureRange"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/TemperatureRange"
            description: "Required temperature range for the assembly process"
            cardinality: "ZeroToOne"
          - type: property
            id_short: "HumidityRange"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/HumidityRange"
            description: "Required humidity range for the assembly process"
            cardinality: "ZeroToOne"
      - type: collection
        id_short: "SafetyRequirements"
        semantic_id: "https://aausmartlab.org/Semantics/SafetyRequirements"
        description: "Safety requirements for the assembly process"
        cardinality: "ZeroToOne"
        elements:
          - type: property
            id_short: "PersonalProtectiveEquipment"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/PersonalProtectiveEquipment"
            description: "Personal protective equipment required for the assembly process"
            cardinality: "ZeroToOne"
          - type: property
            id_short: "SafetyTrainingRequired"
            value_type: "xs:boolean"
            semantic_id: "https://aausmartlab.org/Semantics/SafetyTrainingRequired"
            description: "Indicates if safety training is required for personnel involved in the assembly process"
            cardinality: "ZeroToOne"
      - type: collection
        id_short: "QualityControlChecks"
        semantic_id: "https://aausmartlab.org/Semantics/QualityControlChecks"
        description: "Quality control checks required during or after the assembly process"
        cardinality: "ZeroToOne"
        elements:
          - type: property
            id_short: "CheckType"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/CheckType"
            description: "Type of quality control check (e.g., visual inspection, functional test)"
            cardinality: "One"
          - type: property
            id_short: "CheckFrequency"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/CheckFrequency"
            description: "Frequency of quality control checks (e.g., after each assembly, daily)"
            cardinality: "One"
      - type: collection
        id_short: "AssemblySequence"
        semantic_id: "https://aausmartlab.org/Semantics/AssemblySequence"
        description: "Sequence of steps for the assembly process"
        cardinality: "One"
        elements:
          - type: property
            id_short: "Step1"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/Step1"
            description: "Description of the first step in the assembly sequence"
            cardinality: "One"
          - type: property
            id_short: "Step2"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/Step2"
            description: "Description of the second step in the assembly sequence"
            cardinality: "One"
      - type: collection
        id_short: "AssemblyLocations"
        semantic_id: "https://aausmartlab.org/Semantics/AssemblyLocations"
        description: "Locations where the assembly process can take place"
        cardinality: "One"
        extensible: true
        entry_template: "Location{N}"
        elements:
          - type: collection
            id_short: "Location1"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/Location1"
            description: "Description of the first location for assembly"
            cardinality: "One"
            elements:
              - type: property
                id_short: "Location1Name"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/Location1Name"
                description: "Name of the first location for assembly"
                cardinality: "One"
              - type: property
                id_short: "Location1_x_Coordinate"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/Location1_x_Coordinate"
                description: "X-coordinate of the first location for assembly"
                cardinality: "One"
              - type: property
                id_short: "Location1_y_Coordinate"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/Location1_y_Coordinate"
                description: "Y-coordinate of the first location for assembly"
                cardinality: "One"
          - type: collection
            id_short: "Location2"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.org/Semantics/Location2"
            description: "Description of the second location for assembly"
            cardinality: "zeroToOne"
            elements:
              - type: property
                id_short: "Location2Name"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/Location2Name"
                description: "Name of the second location for assembly"
                cardinality: "One"
              - type: property
                id_short: "Location2_x_Coordinate"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/Location2_x_Coordinate"
                description: "X-coordinate of the second location for assembly"
                cardinality: "One"
              - type: property
                id_short: "Location2_y_Coordinate"
                value_type: "xs:string"
                semantic_id: "https://aausmartlab.org/Semantics/Location2_y_Coordinate"
                description: "Y-coordinate of the second location for assembly"
                cardinality: "One"
  - type: reference_element
    id_short: "ResourceReference"
    semantic_id: "https://aausmartlab.org/Semantics/ResourceReference"
    description: "Reference to the physical resource realizing this capability"
    cardinality: "ZeroToOne"
