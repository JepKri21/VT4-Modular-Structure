id_short: "BillOfMaterials"
id: "https://aausmartlab.com/SubmodelTemplate/SubAssembly/BOM/1/0"
description: "Bill of Materials submodel template for sub-assemblies — add one BOMEntry collection per required component or sub-assembly"

elements:
  - type: collection
    id_short: "BOMEntries"
    semantic_id: "https://aausmartlab.com/Semantics/BOMEntries"
    description: "Container for all BOM entries"
    cardinality: "One"
    extensible: true
    entry_template: "{ComponentName}"
    elements:
      - type: collection
        id_short: "BOMEntry"
        semantic_id: "https://aausmartlab.com/Semantics/BOMEntry"
        description: "Template entry — one collection per required component"
        cardinality: "OneToMany"
        elements:
          - type: property
            id_short: "Description"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.com/Semantics/Description"
            description: "Human-readable description of the component"
            cardinality: "One"

          - type: property
            id_short: "Quantity"
            value_type: "xs:integer"
            semantic_id: "https://aausmartlab.com/Semantics/Quantity"
            description: "Number of this component required"
            cardinality: "One"
            qualifiers:
              - type: "range_min"
                value_type: "xs:integer"
                value: 1
                kind: "TEMPLATE_QUALIFIER"

          - type: property
            id_short: "IsConfigurable"
            value_type: "xs:boolean"
            semantic_id: "https://aausmartlab.com/Semantics/IsConfigurable"
            description: "Whether quantity or variant is configurable per order"
            cardinality: "One"

          - type: property
            id_short: "ConfigurableNote"
            value_type: "xs:string"
            semantic_id: "https://aausmartlab.com/Semantics/ConfigurableNote"
            description: "Explanation of what is configurable or why it is not"
            cardinality: "ZeroToOne"

          - type: reference_element
            id_short: "ComponentTypeRef"
            semantic_id: "https://aausmartlab.com/Semantics/ComponentTypeRef"
            description: "Reference to the AAS type of the required component"
            cardinality: "One"

          - type: reference_element
            id_short: "ComponentInstanceRef"
            semantic_id: "https://aausmartlab.com/Semantics/ComponentInstanceRef"
            description: "Reference to the actual component instance used"
            cardinality: "ZeroToOne"
