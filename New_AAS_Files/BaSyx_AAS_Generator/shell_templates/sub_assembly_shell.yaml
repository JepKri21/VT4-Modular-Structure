# AAS Shell template for Sub-Assembly type assets.
#
# Declares the asset metadata pattern and the required/optional submodels
# that every Sub-Assembly AAS shell must reference.  Concrete shells are
# generated by substituting {name} and {category} at creation time.
#
# asset_kind:
#   "Type"     — a type-level shell (template, no physical instance yet)
#   "Instance" — a specific physical asset
#
# submodels[].required:
#   true  — shell MUST reference this submodel
#   false — shell MAY reference this submodel (optional capability)

kind: "Type"
description: "AAS shell template for Sub-Assembly type assets"

id_pattern: "https://aausmartlab.com/AAS/SubAssembly/{category}/{name}/Instance"
id_short_pattern: "{name}_Instance"
global_asset_id_pattern: "https://aausmartlab.com/Assets/Product/AAU/{name}/Instance"

submodels:
  - template_id: "https://aausmartlab.com/SubmodelTemplate/SubAssembly/Properties/1/0"
    id_short: "ComponentProperties"
    description: "Production tracking, assembly status, and physical properties"
    required: true

  - template_id: "https://aausmartlab.com/SubmodelTemplate/SubAssembly/Documentation/1/0"
    id_short: "Documentation"
    description: "Human-readable reference information (display name, product family)"
    required: true

  - template_id: "https://aausmartlab.com/SubmodelTemplate/SubAssembly/BOM/1/0"
    id_short: "BillOfMaterials"
    description: "Bill of Materials — components and quantities required"
    required: true

  - template_id: "https://aausmartlab.com/SubmodelTemplate/SubAssembly/BOP/1/0"
    id_short: "BillOfProcesses"
    description: "Bill of Processes — ordered assembly steps and required capabilities"
    required: true

