# AAS Shell template for Component type assets.
#
# Declares the asset metadata pattern and the required/optional submodels
# that every Component AAS shell must reference.  Concrete shells are
# generated by substituting {name} and {category} at creation time.
#
# asset_kind:
#   "Type"     — a type-level shell (template, no physical instance yet)
#   "Instance" — a specific physical asset
#
# submodels[].required:
#   true  — shell MUST reference this submodel
#   false — shell MAY reference this submodel (optional capability)

kind: "Type"
description: "AAS shell template for manufactured Component type assets"

id_pattern: "https://aausmartlab.com/AAS/Component/{category}/{name}/Type"
id_short_pattern: "{name}_Type"
global_asset_id_pattern: "https://aausmartlab.com/Assets/Product/AAU/{name}/Type"

submodels:
  - template_id: "https://aausmartlab.com/SubmodelTemplate/Component/Properties/1/0"
    id_short: "ComponentProperties"
    description: "Production-relevant physical and material properties"
    required: true

  - template_id: "https://aausmartlab.com/SubmodelTemplate/Component/Documentation/1/0"
    id_short: "Documentation"
    description: "Human-readable reference information (display name, manufacturer, revision)"
    required: true
