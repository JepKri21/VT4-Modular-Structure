# Preset for a Fuse Module sub-assembly.
# A fuse mounted on a PCB that sits in the 3D-printed bottom cover,
# closed by a 3D-printed top cover.
# Change SerialNumber, BatchNumber, AssemblyDate and AssemblyStation at production time.

shell: "sub_assembly_shell"
label: "Fuse Module – Standard Assembly"
description: "Fuse module consisting of a 3D-printed bottom cover holding a PCB with a mounted fuse, closed by a 3D-printed top cover. Update serial/batch numbers per instance."

asset_name: "FuseModule_A"
asset_category: "Electrical"

submodels:
  Properties:
    PhysicalDimensions:
      Weight_g: 295.7

  Documentation:
    ProductionIdentification:
      ModelNumber: "FM-A-001"
      # SerialNumber: leave blank — unique per instance
      # BatchNumber: leave blank — set at production time
    HardwareRevision: "v1.0"
    DisplayName:
      - language: "en"
        text: "Fuse Module Series A"
      - language: "da"
        text: "Sikringsmodul Serie A"
    Description:
      - language: "en"
        text: "Fuse module — 3D-printed bottom cover holding a PCB with mounted fuse, closed by a 3D-printed top cover"
      - language: "da"
        text: "Sikringsmodul — 3D-printet bundlåg med PCB og monteret sikring, lukket af 3D-printet toplåg"
    ProductFamily: "Fuse Module Series A"

  BillOfMaterials:
    BOMEntries:
      - Description: "Bottom Cover – 3D Print Black"
        Quantity: 1
        IsConfigurable: false
        ConfigurableNote: "Holds the PCB"
      - Description: "PCB Board – FuseBox Series A"
        Quantity: 1
        IsConfigurable: false
        ConfigurableNote: "Mounts into bottom cover"
      - Description: "Fuse – 16A Slow-Blow"
        Quantity: 1
        IsConfigurable: true
        ConfigurableNote: "Current rating is configurable (10A, 16A, 25A)"
      - Description: "Top Cover – 3D Print White"
        Quantity: 1
        IsConfigurable: false
        ConfigurableNote: "Closes the assembly"

  BillOfProcesses:
    ProcessSteps:
      - Operation: "Mount PCB"
        RequiredComponents:
          - "BottomCover"
          - "PCBBoard"
        StepConstraints:
          MaxDuration_s: 120
          RequiresInspection: false
      - Operation: "Mount Fuse"
        RequiredComponents:
          - "PCBBoard"
          - "Fuse"
        StepConstraints:
          MaxDuration_s: 60
          RequiresInspection: false
          RequiredComponentState: "PCB Mounted"
      - Operation: "Close Assembly"
        RequiredComponents:
          - "TopCover"
        StepConstraints:
          MaxDuration_s: 60
          RequiresInspection: true
          RequiredComponentState: "Fuse Mounted"
