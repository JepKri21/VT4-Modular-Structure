[agent]
  interval = "10s"
  flush_interval = "10s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "S18VeAlq042B4naMX31oqIaSGmUmOLAC-DV3VIdkxDJuAhTXLTVFEchyTSmCcUAmB7Wu94KgExzV8gJaDjzR3Q=="
  organization = "basyx"
  bucket = "basyx"

# Generic catch-all: subscribes to every BaSyx MQTT topic and writes each
# JSON payload's fields as-is. Narrow `topics` once you know which topics
# actually carry the data you want in the dashboard.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["BaSyx/#"]
  topic_tag = "topic"
  name_override = "mqtt_message"
  data_format = "json"
